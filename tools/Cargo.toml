[workspace]
resolver = "3"
members = ["exo-dev", "exo-guest", "exo-verify"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
windows = "0.62"

[profile.release]
lto = "thin"
codegen-units = 4

# The host tools are rebuilt in their own target directory per worktree, and
# full debug information was the largest part of it. Line tables keep panic
# backtraces (function and file/line for non-inlined frames) while dropping
# variable and type records nobody reads from a release-style CLI.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.sha2]
opt-level = 3
