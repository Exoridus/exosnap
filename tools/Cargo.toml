[workspace]
resolver = "3"
members = ["exo-dev", "exo-verify"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
windows = "0.62"

[profile.release]
lto = "thin"
codegen-units = 4
