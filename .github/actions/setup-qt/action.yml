name: Set up Qt 6
description: >-
  Install the Qt version this repository is pinned to, in one of the two
  component profiles the build actually needs.

# This action owns Qt provisioning and nothing else. It deliberately does NOT
# touch MSVC, sccache, CMake configure, build, tests or packaging: those have
# their own steps (and, for MSVC, their own composite action) so that a change
# to how Qt is installed can never move a build or a gate by accident.
#
# Base archives and separately packaged modules require different installer
# arguments. Requesting a module as a base archive silently omits it.

inputs:
  profile:
    description: >-
      Which Qt components to install.

      quick — qtbase, qtsvg, qtdeclarative plus the qtshadertools module. Every
              job that has to produce or analyse the shipping application: the
              ExoSnap frontend IS a Qt Quick program, so without
              these find_package(Qt6 ... Quick) fails and the requested
              application cannot be configured.

      base  — qtbase and qtsvg only. For jobs that build the engine and its
              tests with EXOSNAP_BUILD_APP=OFF and never link the frontend.
              Installing the Quick set there would only slow the job down and
              would hide, rather than prove, that the job does not need it.
    required: false
    default: quick
  version:
    description: >-
      Override the canonical version from the repository's .qt-version file.
      Leave empty in normal use — a lane that pins its own version is a lane
      that stops being covered by the next uplift.
    required: false
    default: ''
  arch:
    description: aqtinstall architecture identifier.
    required: false
    default: win64_msvc2022_64
  cache:
    description: Whether install-qt-action may cache the installation.
    required: false
    default: 'true'

outputs:
  version:
    description: The Qt version that was installed.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve Qt version and component profile
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        version='${{ inputs.version }}'
        if [ -z "$version" ]; then
          if [ ! -f .qt-version ]; then
            echo "::error::.qt-version is missing. It is the canonical Qt version for this repository."
            exit 1
          fi
          version=$(tr -d ' \t\r\n' < .qt-version)
        fi
        if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::Qt version '$version' is not a three-part version."
          exit 1
        fi

        case '${{ inputs.profile }}' in
          quick)
            archives='qtbase qtsvg qtdeclarative'
            # Qt 6.12 packages ShaderTools as a module. Requesting it under
            # archives silently omits a required Qt Quick dependency.
            modules='qtshadertools'
            ;;
          base)
            archives='qtbase qtsvg'
            modules=''
            ;;
          *)
            echo "::error::Unknown Qt profile '${{ inputs.profile }}'. Use 'quick' or 'base'."
            exit 1
            ;;
        esac

        {
          echo "version=$version"
          echo "archives=$archives"
          echo "modules=$modules"
        } >> "$GITHUB_OUTPUT"

        echo "Qt $version, profile '${{ inputs.profile }}': archives [$archives], modules [$modules]"

    - name: Install Qt
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
      with:
        version: ${{ steps.resolve.outputs.version }}
        arch: ${{ inputs.arch }}
        archives: ${{ steps.resolve.outputs.archives }}
        modules: ${{ steps.resolve.outputs.modules }}
        # Released aqtinstall 3.3.0 cannot resolve the per-architecture Qt 6.12
        # layout (.../qt6_6120/qt6_6120_msvc2022_64/). Keep the pinned layout fix
        # until a published aqtinstall release includes it.
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
        cache: ${{ inputs.cache }}
