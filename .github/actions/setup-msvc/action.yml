name: Set up MSVC developer environment
description: Configure the Visual Studio developer shell without a Node-based action.

inputs:
  arch:
    description: Target architecture passed to VsDevCmd.
    required: false
    default: x64
  host-arch:
    description: Host architecture passed to VsDevCmd.
    required: false
    default: x64

runs:
  using: composite
  steps:
    - name: Enter Visual Studio developer shell
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
          throw "vswhere.exe was not found at '$vswhere'."
        }

        $vsInstallPath = (& $vswhere `
          -latest `
          -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath).Trim()
        if (-not $vsInstallPath) {
          throw 'No Visual Studio installation with the MSVC x86/x64 tools was found.'
        }

        $devShellModule = Join-Path $vsInstallPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
        if (-not (Test-Path -LiteralPath $devShellModule -PathType Leaf)) {
          throw "Visual Studio developer-shell module was not found at '$devShellModule'."
        }

        $before = @{}
        Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }

        Import-Module $devShellModule -Force
        Enter-VsDevShell `
          -VsInstallPath $vsInstallPath `
          -SkipAutomaticLocation `
          -DevCmdArguments '-no_logo -arch=${{ inputs.arch }} -host_arch=${{ inputs.host-arch }}'

        $changed = Get-ChildItem Env: | Where-Object {
          -not $before.ContainsKey($_.Name) -or $before[$_.Name] -ne $_.Value
        }

        foreach ($entry in $changed) {
          if ($entry.Value -match "[`r`n]") {
            throw "MSVC environment variable '$($entry.Name)' contains a newline and cannot be exported safely."
          }
          "$($entry.Name)=$($entry.Value)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }

        $compiler = Get-Command cl.exe -ErrorAction Stop
        $banner = ((& $compiler.Source 2>&1) | Out-String) -split "`r?`n" |
          Where-Object { $_ -match 'Version \d+\.\d+' } |
          Select-Object -First 1
        if (-not $banner) {
          throw 'cl.exe was found, but its version banner could not be read.'
        }

        Write-Host "Visual Studio: $vsInstallPath"
        Write-Host "Compiler: $($banner.Trim())"
