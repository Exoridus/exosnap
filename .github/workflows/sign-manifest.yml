# sign-manifest.yml -- CI step: generate and sign the ExoSnap update manifest.
#
# Triggered after a release build succeeds. Reads the ed25519 private key from
# the repository secret EXOSNAP_UPDATE_SIGNING_KEY (base64-encoded 32-byte
# ed25519 seed — PyNaCl's SigningKey requires exactly 32 bytes), constructs a
# JSON manifest, and produces a DETACHED ed25519 signature (RFC 8032, verified
# client-side by Monocypher) over the exact manifest bytes.
#
# The signature is detached — it is NOT embedded in the JSON. update-manifest.json
# carries no "signature" field; the 128-hex-char signature travels in a sibling
# asset update-manifest.json.sig. The client verifies the signature against the
# manifest bytes exactly as received, so signer and verifier never have to agree
# on a canonical JSON serialisation (an embedded-signature scheme that
# re-serialised the body on the client broke on every real release because Python
# and the C++ client emitted object keys in different orders).
#
# Both files are uploaded as a CI artifact and attached to the GitHub Release for
# this tag so the in-app updater can fetch them.
#
# MANDATORY from 0.9.0 on. The in-app update checker only surfaces a release that
# carries an update-manifest.json asset (verified against the embedded public key
# before any field is read); a release published without it is invisible to in-app
# updates forever. release-candidate.yml calls this as a required job on a version-
# tag push for official builds, and update-manifest.json must be published as a
# GitHub release asset alongside the ZIP + MSI. (0.4.0–0.8.x shipped check+notify
# only and did not consume this manifest; it was optional then.)
#
# The PRIVATE KEY is NEVER committed to the repository.
# The corresponding PUBLIC KEY (32 bytes) is embedded in the binary at
# build time via EXOSNAP_UPDATE_PUBLIC_KEY_HEX.
#
# Tool: python3 with pynacl (libsodium Python binding), which is available
# on all GitHub Actions runners via pip.

name: Sign Update Manifest

on:
  workflow_call:
    inputs:
      version:
        description: >-
          The FULL release version, prerelease suffix INCLUDED (e.g. '0.9.0-rc4', or
          '0.9.0' for a final). Never the bare base version of a prerelease: this value
          becomes the manifest's `version` AND its `minimum_accepted_version`, both of
          which the client compares by SemVer precedence, and it is what the asset file
          names are built from. Announcing '0.9.0' for an rc4 build made every RC look
          identical to the client, so no RC could ever discover its successor
          (ADR 0054). release-candidate.yml passes resolve-identity's tag-derived
          full_version, which its build job has proven matches the ProductVersion
          string embedded in the shipped executables.
        required: true
        type: string
      installer_sha256:
        required: true
        type: string
      portable_sha256:
        required: true
        type: string
      installer_url:
        required: true
        type: string
      portable_url:
        required: true
        type: string
      attach_to_release:
        description: >-
          Upload the signed manifest to the GitHub Release from this job. Defaults to
          false: the normal path is release-candidate.yml's publish-release, which
          creates the Release, uploads every asset, re-hashes and only then un-drafts.
          A caller that wants this job to attach must ask for it.
        required: false
        type: boolean
        default: false
      release_tag:
        description: >-
          Tag of the GitHub Release the manifest belongs to. Only used when attach_to_release is
          true. Pass it explicitly whenever the caller is not running on that tag's ref — e.g. the
          release-candidate RC path, a workflow_dispatch on a branch that publishes a vX.Y.Z-rcN
          prerelease, where guessing "v<version>" would name the wrong (final) release. Empty falls
          back to the current tag ref, else v<version>.
        required: false
        type: string
        default: ''
    secrets:
      EXOSNAP_UPDATE_SIGNING_KEY:
        required: true
  # Standalone manual trigger (run from the Actions UI after the GitHub Release
  # exists, supplying the final asset URLs + SHA-256 hashes). Uses the repository
  # secret EXOSNAP_UPDATE_SIGNING_KEY directly.
  workflow_dispatch:
    inputs:
      version:
        description: 'FULL release version incl. any prerelease suffix, e.g. 0.9.0 or 0.9.0-rc4. Must match the ProductVersion string of the shipped exosnap.exe.'
        required: true
        type: string
      installer_sha256:
        description: 'SHA-256 of the MSI (hex)'
        required: true
        type: string
      portable_sha256:
        description: 'SHA-256 of the portable ZIP (hex)'
        required: true
        type: string
      installer_url:
        description: 'Public URL of the MSI release asset'
        required: true
        type: string
      portable_url:
        description: 'Public URL of the portable ZIP release asset'
        required: true
        type: string
      attach_to_release:
        description: >-
          Attach the signed manifest to the (already-existing) GitHub Release. Defaults
          to FALSE. The update manifest is what installed clients follow, so attaching
          one to a live release changes what shipping users download next; with this
          off the job still signs the manifest and publishes it as a build artifact,
          which is enough to inspect it or to attach it deliberately. Turning it on is
          gated -- see the guard step in the job below.
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag of the GitHub Release to attach to. Leave empty to use the current tag ref, else v<version>. Set it for a prerelease/RC tag such as v0.9.0-rc1.'
        required: false
        type: string
        default: ''

jobs:
  sign-manifest:
    runs-on: ubuntu-latest
    # Signing, a pip install and at most two asset downloads. Without a timeout the
    # default is six hours.
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      # Pinned so the signing job can't silently pick up a new PyNaCl release
      # mid-cycle; verified working (1.6.2) as of this pin. Bump deliberately.
      - name: Install pynacl
        run: pip install pynacl==1.6.2

      - name: Generate and sign manifest
        env:
          SIGNING_KEY_B64: ${{ secrets.EXOSNAP_UPDATE_SIGNING_KEY }}
          VERSION:          ${{ inputs.version }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
          PORTABLE_SHA256:  ${{ inputs.portable_sha256 }}
          INSTALLER_URL:    ${{ inputs.installer_url }}
          PORTABLE_URL:     ${{ inputs.portable_url }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, re, sys, nacl.signing

          version = os.environ["VERSION"]

          # Fail closed to the exact release language the client orders: a final
          # X.Y.Z or an rcN candidate. Signing a broader prerelease label would let
          # the pipeline publish identities the runtime intentionally collapses.
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(-rc[1-9][0-9]*)?", version):
              print(f"::error::version '{version}' is not a valid SemVer release version "
                    "(expected X.Y.Z or X.Y.Z-rcN with N >= 1).")
              sys.exit(1)
          # '-dev' is the root CMakeLists.txt marker for an UNOFFICIAL developer build.
          # A signed manifest announcing one would offer users an artifact that was never
          # an official release.
          if version.endswith("-dev"):
              print(f"::error::version '{version}' uses the reserved '-dev' label, which marks "
                    "unofficial developer builds. Refusing to sign a manifest for it.")
              sys.exit(1)

          seed_b64 = os.environ["SIGNING_KEY_B64"]
          seed = base64.b64decode(seed_b64)
          signing_key = nacl.signing.SigningKey(seed)

          manifest = {
              # Both fields carry the FULL version, prerelease suffix included. The
              # client orders releases by SemVer precedence, under which 0.9.0-rc4 < 0.9.0
              # and 0.9.0-rc4 < 0.9.0-rc5, so an RC correctly sees both its successor RC
              # and the eventual final as newer. Using the base version here collapsed
              # every candidate of a base onto one indistinguishable value (ADR 0054).
              "version":                  version,
              "minimum_accepted_version": version,
              "packages": [
                  {
                      "kind":   "installer",
                      "url":    os.environ["INSTALLER_URL"],
                      "sha256": os.environ["INSTALLER_SHA256"].lower()
                  },
                  {
                      "kind":   "portable",
                      "url":    os.environ["PORTABLE_URL"],
                      "sha256": os.environ["PORTABLE_SHA256"].lower()
                  }
              ]
          }

          # Serialise ONCE and sign the exact bytes we ship. The signature is
          # detached: it never re-enters the JSON, so the client verifies it over
          # the manifest bytes verbatim with no canonicalisation on either side.
          manifest_bytes = json.dumps(manifest, indent=2).encode("utf-8")
          sig_hex = signing_key.sign(manifest_bytes).signature.hex()

          with open("update-manifest.json", "wb") as f:
              f.write(manifest_bytes)
          with open("update-manifest.json.sig", "w", newline="") as f:
              f.write(sig_hex)

          print("Manifest signed successfully (detached signature).")
          print(f"Version:   {manifest['version']}")
          print(f"Signature: {sig_hex[:16]}...")
          EOF

      # Fail-closed integrity gate. Two things a release must never get wrong:
      #   (a) the signing key must be the private half of the public key EMBEDDED in
      #       the shipped binary (EXOSNAP_UPDATE_PUBLIC_KEY_HEX) — otherwise the app
      #       rejects every signature and the release is invisible to the updater;
      #   (b) the detached signature must actually verify over the manifest bytes.
      # Both are checked here against the embedded public key, not merely against the
      # key we just signed with, so a mismatched keypair hard-fails in CI.
      #
      # Plus (c): the manifest that actually got written must announce the version this
      # job was asked to sign — read back off disk, not from the in-memory dict of the
      # previous step. A manifest whose `version` drifted from the release identity would
      # be a correctly signed lie, and the signature check alone cannot catch that.
      - name: Verify keypair + signature against the embedded public key
        env:
          SIGNING_KEY_B64:     ${{ secrets.EXOSNAP_UPDATE_SIGNING_KEY }}
          EXPECTED_PUBKEY_HEX: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
          VERSION:             ${{ inputs.version }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, nacl.signing, nacl.encoding

          expected_version = os.environ["VERSION"]
          written = json.load(open("update-manifest.json"))
          for field in ("version", "minimum_accepted_version"):
              if written.get(field) != expected_version:
                  print(f"::error::update-manifest.json {field}='{written.get(field)}' does not match "
                        f"the release version '{expected_version}' this job was asked to sign.")
                  sys.exit(1)
          print(f"Manifest announces version={expected_version} (also minimum_accepted_version).")

          seed = base64.b64decode(os.environ["SIGNING_KEY_B64"])
          sk = nacl.signing.SigningKey(seed)
          derived = sk.verify_key.encode(encoder=nacl.encoding.HexEncoder).decode().lower()
          expected = (os.environ.get("EXPECTED_PUBKEY_HEX") or "").strip().lower()

          if not expected:
              print("::error::EXOSNAP_UPDATE_PUBLIC_KEY_HEX is not set; cannot prove the signing key matches the embedded public key.")
              sys.exit(1)
          if derived != expected:
              print("::error::Signing keypair mismatch: EXOSNAP_UPDATE_SIGNING_KEY is NOT the private half of the embedded "
                    f"EXOSNAP_UPDATE_PUBLIC_KEY_HEX (derived {derived[:16]}... != embedded {expected[:16]}...). "
                    "Clients would reject every signature.")
              sys.exit(1)

          data = open("update-manifest.json", "rb").read()
          sig = bytes.fromhex(open("update-manifest.json.sig").read().strip())
          sk.verify_key.verify(data, sig)  # raises nacl.exceptions.BadSignatureError on failure
          print("Keypair matches the embedded public key and the detached signature verifies.")
          EOF

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: update-manifest
          path: |
            update-manifest.json
            update-manifest.json.sig
          if-no-files-found: error

      # Attach the manifest + its detached signature to the GitHub Release for
      # this tag so release_locator (which requires both assets) can surface the
      # update. Skipped in the automated version-tag path (attach_to_release: false):
      # there the release-candidate publish-release job creates the draft Release,
      # uploads every asset, re-verifies, and un-drafts, so the Release is guaranteed
      # to exist before anything is uploaded. Runs on the standalone workflow_dispatch
      # path (the manual escape hatch), where the Release is expected to already exist.
      # THE guard on the one bypass path that can change what shipping users download
      # next. Attaching a manifest to a DRAFT is harmless: a draft is invisible to the
      # updater, and publish-release re-verifies everything before it un-drafts.
      # Attaching to a release that is already public is a different act, and it used
      # to run with no CI gate, no qualification gate, and no check that the hashes in
      # the manifest describe the bytes that release actually serves.
      #
      # Two conditions now, both fail-closed:
      #   (a) the manifest's declared SHA-256s must match the assets the target release
      #       currently serves, re-hashed here rather than trusted from the inputs; and
      #   (b) the release's commit must be covered by a signed, qualified
      #       release-verification record -- the same bar publish-release holds a final
      #       tag to.
      # A release candidate carries no record of its own by definition, so re-signing a
      # published RC by hand is refused: cut the next candidate instead.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ inputs.attach_to_release }}
        with:
          path: repo

      - name: Refuse to attach to a release that was never qualified
        if: ${{ inputs.attach_to_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_KEY_HEX: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
          RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version)) }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Block([string] $Reason) {
              @('## Update manifest: NOT attached', '', "- $Reason") |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              Write-Host "::error::$Reason"
              exit 1
          }

          $release = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $release) {
              Block "There is no release tagged $env:RELEASE_TAG to attach a manifest to."
          }
          if ($release.draft) {
              Write-Host "Release $env:RELEASE_TAG is still a draft, so attaching changes nothing a user can see."
              exit 0
          }

          $version = $env:VERSION_INPUT
          $base = ($version -split '-')[0]
          New-Item -ItemType Directory -Path published -Force | Out-Null
          & gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir published --clobber `
              --pattern "ExoSnap-$version-windows-x64.msi" `
              --pattern "ExoSnap-$version-windows-x64-portable.zip"
          if ($LASTEXITCODE -ne 0) {
              Block "Release $env:RELEASE_TAG serves no ExoSnap-$version assets, so a manifest naming that version would point at bytes that are not there."
          }

          $manifest = Get-Content -LiteralPath update-manifest.json -Raw | ConvertFrom-Json
          $assets = @{
              installer = "published/ExoSnap-$version-windows-x64.msi"
              portable  = "published/ExoSnap-$version-windows-x64-portable.zip"
          }
          foreach ($package in $manifest.packages) {
              $path = $assets[$package.kind]
              if (-not $path -or -not (Test-Path -LiteralPath $path)) {
                  Block "The manifest lists a '$($package.kind)' package but the release serves no such asset."
              }
              $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne "$($package.sha256)".ToLowerInvariant()) {
                  Block "The manifest says $($package.kind) is $($package.sha256), but $env:RELEASE_TAG actually serves $actual. Signing that would announce an update no client can verify."
              }
          }

          try {
              $rcTag = & ./repo/scripts/find-qualified-rc.ps1 -Repository $env:GITHUB_REPOSITORY `
                  -BaseVersion $base -Commit $release.target_commitish -OutputDirectory rc-qualification
          }
          catch { Block $_.Exception.Message }

          & ./repo/scripts/check-release-qualification.ps1 `
              -RecordPath rc-qualification/release-verification.json `
              -PublicKeyHex $env:PUBLIC_KEY_HEX `
              -ExpectedCommit $release.target_commitish -ExpectedRcTag $rcTag `
              -Sha256Directory rc-qualification -SummaryPath $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) {
              Block "Release $env:RELEASE_TAG is published and its commit carries no qualified record, so a re-signed update manifest must not be attached to it."
          }

      - name: Attach manifest to the release
        if: ${{ inputs.attach_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version)) }}
        run: |
          gh release upload "$RELEASE_TAG" \
            update-manifest.json update-manifest.json.sig \
            --clobber --repo "$GITHUB_REPOSITORY"

  # ---------------------------------------------------------------------------
  # Authenticode signing hook (DORMANT -- awaiting SignPath cert)
