name: Final pinned v0.12 Git integration

on:
  push:
    branches: [verify/v012-final-tip]

permissions:
  contents: read

jobs:
  compare-trees:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare exact PR trees and compute the integrated tree
        shell: python
        run: |
          import itertools
          import json
          import os
          from pathlib import Path
          import subprocess

          base = "73b1e3811b2c349ef38cbb7f49abdb89fa9be73f"
          current_next = "22c77dad6de925e61b58cc29efa0a58d5fcc4f87"
          missions = {
              "600": "a1ea6ddab878228eee9673eef06996b1900fd024",
              "601": "433712b4fd0afd4dd00d7fcfdd4a596a30937f28",
              "602": "751b2abb3b0d182423412e99f482ca34fbc6c131",
          }
          protected = {
              "596": "2b1e09e5270188e79294b93786bbf7494d177fb2",
              "598": "be483ea9bf1c40b472fabb9effcb94671f84327e",
              "599": "a6bf49b056ebb45af9e17ff9b0553fbe274642c0",
          }
          receipt = {
              "base": base, "currentNext": current_next, "missionHeads": missions, "protectedHeads": protected,
              "workflowCommit": os.environ["GITHUB_SHA"], "pairwise": [], "combined": [],
              "boundary": "Pinned Git tree comparisons only. No build, tests, installation or remote ref updates.",
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "v012-final-tip.json"
          os.environ.update({
              "GIT_AUTHOR_NAME": "ExoSnap integration qualification",
              "GIT_COMMITTER_NAME": "ExoSnap integration qualification",
              "GIT_AUTHOR_EMAIL": "qualification@invalid.example",
              "GIT_COMMITTER_EMAIL": "qualification@invalid.example",
              "GIT_AUTHOR_DATE": "2000-01-01T00:00:00+00:00",
              "GIT_COMMITTER_DATE": "2000-01-01T00:00:00+00:00",
          })

          def git(*args, check=True):
              return subprocess.run(["git", *args], capture_output=True, text=True, encoding="utf-8",
                                    errors="replace", timeout=120, check=check)

          try:
              receipt["gitVersion"] = git("--version").stdout.strip()
              workflow = ".github/workflows/v012-final-tip.yml"
              if (git("rev-parse", "HEAD").stdout.strip() != receipt["workflowCommit"]
                      or git("rev-parse", "HEAD^").stdout.strip() != missions["602"]
                      or git("diff", "--name-only", missions["602"], "HEAD").stdout.splitlines() != [workflow]):
                  raise RuntimeError("Unexpected verification source or diff")
              heads = {**missions, **protected}
              for number, sha in heads.items():
                  if git("cat-file", "-e", sha + "^{commit}", check=False).returncode:
                      # A squash-merged PR may no longer have a branch. Its original PR ref
                      # lets the read-only checkout recover the required commit object.
                      git("fetch", "--no-tags", "--no-write-fetch-head",
                          "https://github.com/Exoridus/exosnap.git", f"refs/pull/{number}/head")
                  if git("cat-file", "-t", sha).stdout.strip() != "commit":
                      raise RuntimeError("Expected a commit for PR " + number)
                  git("merge-base", "--is-ancestor", base, sha)

              pairs = [*itertools.combinations(missions, 2), *itertools.product(missions, protected)]
              if git("cat-file", "-t", current_next).stdout.strip() != "commit":
                  raise RuntimeError("Expected a commit for current next")
              git("merge-base", "--is-ancestor", base, current_next)
              heads["next"] = current_next
              pairs.extend((mission, "next") for mission in missions)
              for left, right in pairs:
                  result = git("merge-tree", "--write-tree", "--name-only", heads[left], heads[right], check=False)
                  receipt["pairwise"].append({
                      "leftPr": left, "leftSha": heads[left], "rightPr": right, "rightSha": heads[right],
                      "exitCode": result.returncode, "stdout": result.stdout[:131072], "stderr": result.stderr[:32768],
                  })
                  print(f"PR {left} + #{right}: Git exit {result.returncode}", flush=True)
              if len(pairs) != 15 or any(row["exitCode"] for row in receipt["pairwise"]):
                  raise RuntimeError("Pairwise comparison failed")

              current = missions["600"]
              for number in ("601", "602"):
                  other = missions[number]
                  merged = git("merge-tree", "--write-tree", "--name-only", current, other, check=False)
                  row = {"left": current, "right": other, "exitCode": merged.returncode,
                         "stdout": merged.stdout[:131072], "stderr": merged.stderr[:32768]}
                  receipt["combined"].append(row)
                  if merged.returncode:
                      raise RuntimeError("Combined tree conflicts at PR " + number)
                  tree = merged.stdout.strip()
                  if git("cat-file", "-t", tree).stdout.strip() != "tree":
                      raise RuntimeError("Expected one clean Git tree")
                  current = git("-c", "commit.gpgsign=false", "commit-tree", tree, "-p", current, "-p", other,
                                "-m", "Local v0.12 integration through PR " + number).stdout.strip()
                  row.update({"tree": tree, "commit": current})
              if tree != "0a6b5d8f6758f756d30525fca1cfaa322e7479ee" or current != "ca45766d8eb1897ee8ba00a3dd5ecfe508e5da7f":
                  raise RuntimeError("Different combined source from the original Release qualification")
              receipt["missionCommit"] = current
              receipt["missionTree"] = tree
              result = git("merge-tree", "--write-tree", "--name-only", current, current_next, check=False)
              final = {"left": current, "right": current_next, "exitCode": result.returncode,
                       "stdout": result.stdout[:131072], "stderr": result.stderr[:32768]}
              receipt["currentNextIntegration"] = final
              if result.returncode:
                  raise RuntimeError("Three-mission integration conflicts with current next")
              tree = result.stdout.strip()
              if git("cat-file", "-t", tree).stdout.strip() != "tree":
                  raise RuntimeError("Expected one clean next-plus-missions tree")
              current = git("-c", "commit.gpgsign=false", "commit-tree", tree, "-p", current, "-p", current_next,
                            "-m", "Local v0.12 integration with pinned current next").stdout.strip()
              final.update({"tree": tree, "commit": current})
              receipt["finalCommit"] = current
              receipt["finalTree"] = tree
              print(f"Combined source {current} tree {tree}", flush=True)
          finally:
              target.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")

      - name: Retain textual integration receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v012-final-tip
          path: ${{ runner.temp }}/v012-final-tip.json
          if-no-files-found: error
