name: Advisory Checks

# Findings are successful measurements. Tool/setup/parse failures fail this
# workflow. The broad scan runs separately from PR CI because of its cost.

on:
  # Nightly on the default branch. 03:00 UTC is off-peak for GitHub's hosted
  # Windows pool, and a run that starts then has finished long before the
  # working day. schedule events always run on the default branch (next).
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Keep measurements independent: cancelling a run discards its evidence.

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  advisory-unused-checks:
    name: advisory-unused-checks
    runs-on: windows-2022
    # Qt-heavy translation units require a larger budget than blocking lint.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # 'quick', because this job's clang-tidy pass lists app/ sources: with the
      # 'base' profile the Qt Quick application is not in the compile database at
      # all, and every app/quick file is skipped for lack of a compile command --
      # an advisory pass that quietly covers less than it claims.
      - name: Install Qt 6
        uses: ./.github/actions/setup-qt
        with:
          profile: quick

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      # Configure the Ninja debug preset with CMAKE_EXPORT_COMPILE_COMMANDS=ON
      # (already set in CMakePresets.json for windows-x64-ninja-debug).
      # compile_commands.json is required by misc-include-cleaner.
      - name: Configure (windows-x64-ninja-debug)
        run: cmake --preset windows-x64-ninja-debug -DEXOSNAP_USE_SCCACHE=ON

      - name: Build (windows-x64-ninja-debug)
        run: cmake --build --preset windows-x64-ninja-debug

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Provision pinned cppcheck
        run: cargo exo-dev setup cppcheck

      - name: clang-tidy advisory checks
        run: cargo exo-dev lint quality --only clang-tidy --build-dir build/windows-x64-ninja-debug --report-path .workspace/advisory/clang-tidy.txt

      - name: cppcheck unusedFunction (advisory)
        if: ${{ !cancelled() }}
        run: cargo exo-dev lint quality --only cppcheck-unused-function --report-path .workspace/advisory/cppcheck.txt

      - name: Retain raw diagnostics, normalized sites and summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: advisory-diagnostics
          path: .workspace/advisory/
          include-hidden-files: true
          if-no-files-found: error
