name: Read installer lifecycle failure

on:
  push:
    branches: [verify/v012-install-lifecycle-log]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact lifecycle failure logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '15202320377'
          run-id: '46001359896'
          github-token: ${{ github.token }}
          path: logs
          merge-multiple: true
      - name: Read bounded diagnostic lines
        shell: python
        run: |
          import pathlib
          import re

          for name in ("user-install.log", "user-repair.log", "user-uninstall.log", "user-setup.log"):
              path = pathlib.Path("logs") / name
              data = path.read_bytes()
              encoding = "utf-16" if data.startswith((b"\xff\xfe", b"\xfe\xff")) else "utf-8-sig"
              lines = data.decode(encoding, errors="replace").splitlines()
              pattern = r"(?:\]i(?:100|199|200|299|300|399|500|007):|\]e\d+:|Return value 3|MainEngineThread is returning|Installation success or error status:)"
              selected = [line for line in lines if re.search(pattern, line, re.I)]
              print(f"{name}: {len(lines)} lines, {len(selected)} matches")
              for line in selected[:80]:
                  print("  | " + line[:800])
