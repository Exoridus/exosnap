name: Read installer lifecycle failure

on:
  push:
    branches: [verify/v012-install-lifecycle-log]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact lifecycle failure logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '15208890674'
          run-id: '46018116857'
          github-token: ${{ github.token }}
          path: logs
          merge-multiple: true
      - name: Read bounded diagnostic lines
        shell: python
        run: |
          import pathlib
          import re

          for name in ("user-install.log", "user-repair.log", "user-rollback.log"):
              path = pathlib.Path("logs") / name
              data = path.read_bytes()
              encoding = "utf-16" if data.startswith((b"\xff\xfe", b"\xfe\xff")) else "utf-8-sig"
              lines = data.decode(encoding, errors="replace").splitlines()
              pattern = r"(?:Property\([CS]\): (?:ALLUSERS|MSIINSTALLPERUSER|ProductCode|ProductVersion|EXOSNAP_REQUESTED_SCOPE) =|Executing op: (?:ProductRegister|ProductPublish|ProductUnregister|ProductUnpublish)\(|Executing op: Reg(?:Add|Open)Value\(.*?DisplayVersion|MSI_LUA: .*?(?:per-user|per-machine))"
              selected = [line for line in lines if re.search(pattern, line, re.I)]
              print(f"{name}: {len(lines)} lines, {len(selected)} matches")
              for line in selected[:80]:
                  print("  | " + line[:800])
              if name == "user-rollback.log":
                  opened = ""
                  for line in lines:
                      if "Executing op: RegOpenKey(" in line:
                          opened = line
                      elif "Executing op: RegAddValue(Name=DisplayVersion," in line:
                          print("  | Target: " + opened[:800])
      - name: Download exact standard-account evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '15211862205'
          run-id: '46020290997'
          github-token: ${{ github.token }}
          path: standard
          merge-multiple: true
      - name: Inspect standard-account outcome
        shell: python
        run: |
          import pathlib
          import re
          base = pathlib.Path("standard")
          failure = base / "failure.txt"
          data = failure.read_bytes()
          if len(data) > 16384:
              raise RuntimeError("Unexpected failure receipt size")
          encoding = "utf-16" if data.startswith((b"\xff\xfe", b"\xfe\xff")) else "utf-8-sig"
          print("  | Standard-account failure: " + data.decode(encoding, errors="replace").strip()[:800])
          for name in ("install-0.10.1.log", "install-0.10.2.log", "cached-repair.log", "cached-uninstall.log"):
              log = base / name
              if not log.is_file():
                  continue
              data = log.read_bytes()
              if len(data) > 32 * 1024 * 1024:
                  raise RuntimeError("Unexpected Burn log size")
              encoding = "utf-16" if data.startswith((b"\xff\xfe", b"\xfe\xff")) else "utf-8-sig"
              lines = data.decode(encoding, errors="replace").splitlines()
              found = [line for line in lines if re.search(r"\]e\d+:|\]i(?:199|299|399|007):", line)]
              print(name)
              for line in found[:30]:
                  print("  | " + line[:800])
          for index in (0, 1):
              path = base / f"install-0.10.1_{index:03d}_ExoSnapMsi.log"
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if len(data) > 32 * 1024 * 1024:
                  raise RuntimeError("Unexpected MSI log size")
              encoding = "utf-16" if data.startswith((b"\xff\xfe", b"\xfe\xff")) else "utf-8-sig"
              lines = data.decode(encoding, errors="replace").splitlines()
              pattern = r"DisableMSI|DisableUserInstalls|AlwaysInstallElevated|prohibit|restricted|forbidden|1625|MSI_LUA|software restriction|AppLocker|signature"
              print(path.name)
              for line in [line for line in lines if re.search(pattern, line, re.I)][:40]:
                  print("  | " + line[:800])
