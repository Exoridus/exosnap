name: Read installer lifecycle failure

on:
  push:
    branches: [verify/v012-install-lifecycle-log]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact lifecycle failure logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '15205853725'
          run-id: '46012942319'
          github-token: ${{ github.token }}
          path: logs
          merge-multiple: true
      - name: Read bounded diagnostic lines
        shell: python
        run: |
          import pathlib
          import re

          for name in ("user-rollback.log",):
              path = pathlib.Path("logs") / name
              data = path.read_bytes()
              encoding = "utf-16" if data.startswith((b"\xff\xfe", b"\xfe\xff")) else "utf-8-sig"
              lines = data.decode(encoding, errors="replace").splitlines()
              pattern = r"(?:Executing op: (?:FileRemove|FileCopy|FileRestore|FileRename).*?exosnap\.exe|Executing op: (?:ProductUnpublish|ProductPublish|ProductRegister|ProductUnregister)|UPGRADINGPRODUCTCODE property|Action (?:start|ended) .*?(?:RemoveExistingProducts|ForceFixtureRollback|UnpublishProduct)|Executing op: .*?Rollback.*?exosnap\.exe)"
              selected = [line for line in lines if re.search(pattern, line, re.I)]
              print(f"{name}: {len(lines)} lines, {len(selected)} matches")
              for line in selected[:80]:
                  print("  | " + line[:800])
