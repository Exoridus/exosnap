name: Cache Warm

# push -> next no longer builds anything (see ci.yml's "WHAT RUNS WHERE" header),
# so without this workflow next's sccache scope -- the only scope every PR can
# read from -- would go stale between nightly advisory-checks.yml runs, and the
# next PR's first build would start cold. This workflow exists solely to keep
# that scope warm for both Ninja presets when build inputs change. It reports no
# tests and no status the README badge or branch protection depends on.
#
# This workflow is the writer of that shared scope. Pull requests and tags are
# read-only in ci.yml, so their disposable scopes never compete with next for
# the repository's cache budget.
on:
  push:
    branches: [next]
    paths-ignore:
      - 'docs/**/*.md'
      - 'docs/assets/readme-hero.png'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'PRIVACY.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"
  # A writer of the shared branch scope, together with the crash-capture
  # workflow's push handler. See ci.yml for why pull requests and tags are
  # read-only.
  SCCACHE_GHA_RW_MODE: "READ_WRITE"
  # The sccache server exits after its idle timeout (600 s by default), and a
  # `--show-stats` that outlives it silently starts a fresh server and reports
  # zeros rather than failing. Any job whose stats step sits behind a long
  # non-compiling step -- the scoped clang-tidy set, the full test suite --
  # would report an unobservable cache. Keeping the server alive for the life
  # of the runner costs nothing: the VM is torn down either way.
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  cache-warm-debug:
    name: cache-warm (windows-x64-ninja-debug)
    runs-on: windows-2022
    # First complete clang-tidy seed can take over two hours. Later runs
    # replay unchanged per-TU verdicts and refresh only invalidated inputs.
    timeout-minutes: 180
    concurrency:
      group: cache-warm-debug-next
      # A new next push must not interrupt the sole shared-cache writer before
      # its clang-tidy verdicts have been saved.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt 6
        uses: ./.github/actions/setup-qt
        with:
          profile: quick

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure (windows-x64-ninja-debug)
        run: cmake --preset windows-x64-ninja-debug -DEXOSNAP_USE_SCCACHE=ON

      - name: Build (windows-x64-ninja-debug)
        run: cmake --build --preset windows-x64-ninja-debug

      # Pull requests can read next's cache scope, but their merge-ref caches
      # are not shared with other PRs. Keep a full-tree verdict seed in next's
      # branch scope so a PR's first run can replay unchanged TUs. The same
      # per-TU input/toolchain validation as the required Debug gate is used.
      - name: Restore blocking clang-tidy verdict cache
        id: tidy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] -- only the protected next branch writes these validated verdicts
        with:
          path: ${{ runner.temp }}/clang-tidy-cache
          key: clang-tidy-blocking-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clang-tidy-blocking-${{ runner.os }}-

      - name: Warm blocking clang-tidy verdicts (full tree)
        shell: pwsh
        env:
          TIDY_CACHE: ${{ runner.temp }}/clang-tidy-cache
          TIDY_PROFILE: ${{ runner.temp }}/clang-tidy-warm-profile.json
          EXO_DEV_CLANG_TIDY_PROGRESS: '1'
          EXO_DEV_CLANG_TIDY_PROFILE: public
        run: >-
          cargo exo-dev lint clang-tidy
          --build-dir build/windows-x64-ninja-debug
          --cache-dir $env:TIDY_CACHE --jobs 4
          --profile-path $env:TIDY_PROFILE

      # Cache keys are immutable. A run-unique key retains the restored verdicts
      # plus newly validated TUs even if a subset reports findings or fails.
      # The next writer and PR restore by prefix without weakening any checks.
      - name: Save blocking clang-tidy verdict cache
        if: always() && steps.tidy-cache.outputs.cache-primary-key != '' && steps.tidy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clang-tidy-cache
          key: ${{ steps.tidy-cache.outputs.cache-primary-key }}

      - name: Retain full-tree clang-tidy warmup profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clang-tidy-next-warm-profile
          path: ${{ runner.temp }}/clang-tidy-warm-profile.json
          if-no-files-found: ignore

      - name: sccache stats
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          label: windows-x64-ninja-debug

  cache-warm-release:
    name: cache-warm (windows-x64-ninja-release)
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: cache-warm-release-next
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt 6
        uses: ./.github/actions/setup-qt
        with:
          profile: quick

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure (windows-x64-ninja-release)
        run: cmake --preset windows-x64-ninja-release -DEXOSNAP_USE_SCCACHE=ON

      - name: Build (windows-x64-ninja-release)
        run: cmake --build --preset windows-x64-ninja-release

      - name: sccache stats
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          label: windows-x64-ninja-release
