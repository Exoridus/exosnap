name: Diagnostics helper source ownership qualification

on:
  push:
    branches: [verify/v012-diagnostics-source-ownership]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fca2bd35ccce24b2028dd19af80f40f0e3552dee
          persist-credentials: false
      - name: Capture exact pinned formatter changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/helper-format"
          "$RUNNER_TEMP/helper-format/bin/python" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: clang-format==19.1.7
          formatter="$RUNNER_TEMP/helper-format/bin/clang-format"
          "$formatter" --version
          "$formatter" --version | grep -F '19.1.7'
          git ls-files -z -- 'apps/diagnostics_helper/*.cpp' 'apps/diagnostics_helper/*.h' 'app/tests/test_diagnostics_helper_protocol.cpp' 'app/tests/test_diagnostics_helper_trace_cleanup.cpp' | xargs -0 -r "$formatter" --style=file -i
          git diff --check
          echo FORMAT-DIFF-BEGIN
          git -c color.ui=false diff --no-ext-diff -- apps/diagnostics_helper/ app/tests/test_diagnostics_helper_protocol.cpp app/tests/test_diagnostics_helper_trace_cleanup.cpp
          echo FORMAT-DIFF-END
      - name: Check helper with the repository cppcheck options
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version
          cppcheck --enable=warning,performance,portability --std=c++20 --error-exitcode=1 --inline-suppr --suppressions-list=.cppcheck-suppress --library=windows --library=qt '-DQ_MOC_INCLUDE(x)=' -q -I libs/engine/include -I libs/capability/include -i libs/update/third_party apps/diagnostics_helper/

  windows-cppcheck:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fca2bd35ccce24b2028dd19af80f40f0e3552dee
          persist-credentials: false
      - run: cargo exo-dev setup cppcheck
      - run: cargo test --manifest-path tools/exo-dev/Cargo.toml tracks_the_privileged_helper_without_widening_other_app_roots
      - run: cargo exo-dev lint quality --only cppcheck
