name: CI

on:
  # Run on the default branch and release tags directly, and on every pull
  # request. Feature branches are covered by their PR, so a plain branch push
  # no longer triggers a second, redundant run alongside the pull_request run.
  push:
    branches: [main, next]
    tags: ['v*']
  # Deliberately NOT `edited`. This workflow decides things about the TREE, and a
  # title or description edit does not change the tree -- it used to trigger the
  # full Windows build and test matrix because the pull request title check lived
  # in the guardrails job below. That check now lives in .github/workflows/pr-policy.yml,
  # which is where `edited` belongs and where it costs seconds.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# WHAT RUNS WHERE
#
# A merge into next has just passed the pull request build. A release publish
# advances main to the already verified candidate commit. Re-running the full
# Windows matrix on either push repeats that evidence at substantial cost.
#
# So the heavy legs are gated to where they can still catch something new:
#
#   pull_request      lint, dev-scripts, changes, build-test (debug, full
#                     suite), build-test (release, configure/build/link only)
#                     when the `build` filter matches (any C++ or build
#                     machinery), plus the packaging smoke on that release
#                     build when the `packaging` filter matches
#   push → main/next  lint, dev-scripts, changes            (quick checks only)
#   push → v* tag     everything except the packaging smoke, with the Release
#                     test suite included                   (release gate)
#   workflow_dispatch everything except the packaging smoke (manual full run)
#
# The AUTHORITATIVE verdict on pull request METADATA -- the title, which is the
# subject the squash merge lands on next or main -- is NOT this workflow's. It lives in
# .github/workflows/pr-policy.yml under its own `pr-policy-required` context,
# because the title is the one input that changes without a push and would
# otherwise re-run this whole matrix for a string.
#
# The guardrails job below still runs the same check as a PREFLIGHT, because the
# two workflows cannot wait on each other and the Windows legs hang off
# guardrails. That is a cost gate, not a second policy; the difference that
# matters is that this workflow does not listen for `edited`.
#
# Accepted trade-off: a semantic merge skew -- two PRs that are each green alone
# but broken together -- is no longer caught by the branch push itself. It surfaces
# on the next PR's build (which branches off the merged next) or on the nightly
# advisory run, i.e. hours rather than minutes later. A merge queue is not the
# same trade: it would catch the skew, by testing each candidate against the
# merge result before it lands, at the cost of serializing merges behind a full
# suite run each. What is accepted here is later detection, not an equivalent
# delay -- it is cheap while next is a low-traffic branch, and a merge queue is
# the answer if that stops being true.
#
# The broad advisory static-analysis pass used to live here as
# `advisory-unused-checks` and ran on every push to the development branch. It now lives in
# .github/workflows/advisory-checks.yml on a nightly schedule (plus
# workflow_dispatch; no pull_request trigger — an in-progress 45 min advisory
# job delayed auto-merge on every PR) — see that file's header for why it is a
# separate workflow rather than a `schedule:` trigger on this one.
#
# Because push -> next no longer builds, next's sccache scope (the only scope
# every PR can read from) would otherwise only get refreshed once a night by
# advisory-checks.yml's debug-only build. .github/workflows/cache-warm.yml
# builds both Ninja presets on every push to next instead, so the next PR's
# first run starts from a warm cache rather than the nightly leftovers.
# ---------------------------------------------------------------------------

# NOTE: concurrency is intentionally set per-JOB below, not at the workflow
# level. A workflow-level `concurrency:` cancels the entire run — every job in
# it — the instant a newer commit lands on the same ref, regardless of that
# job's own continue-on-error setting; the torn-down jobs then report conclusion
# "cancelled", which GitHub renders as a failed/incomplete check on an
# otherwise-green commit ("Some checks were not successful"). Per-job
# concurrency groups (below) preserve the "cancel stale runs on the same
# PR" behavior without that cross-job blast radius.
#
# Cancellation is scoped to pull_request events ONLY. "skipped" and "cancelled"
# are not the same thing: a skipped job leaves the run green, a cancelled one
# does not. On a PR, a newer commit makes the older run's result worthless, so
# cancelling is pure savings. Everywhere else a cancelled run can do damage:
# two quick next merges in close succession must BOTH reach a real conclusion
# (the newest ci.yml run on next drives the README badge), and a tag or manual
# release-gate run must never be torn down by a racing event. So the group key
# is the PR number when there is one and the unique run id otherwise — non-PR
# runs each sit alone in their own group and can never collide — and
# cancel-in-progress is simply always-on, which by construction only ever
# cancels a stale run of the same PR.

# Use sccache (GitHub Actions cache backend) as the MSVC compiler launcher to
# cache compilation across runs. This requires the Ninja generator — the Visual
# Studio / MSBuild generator ignores CMAKE_CXX_COMPILER_LAUNCHER. /Z7 (embedded
# debug info) is already the project default, so the object cache has no PDB
# contention. Ninja + MSVC needs the dev-cmd environment for cl.exe.
env:
  SCCACHE_GHA_ENABLED: "true"
  # A tag ref writes to its own scope, which nothing ever reads again (a tag is
  # never rebuilt) — every object sccache would write there is pure write cost
  # against the repository's shared 10 GB cache budget, evicting entries a PR
  # could actually have hit. Read-only on tags gets whatever next last warmed
  # without adding to the pile; PRs and next keep read-write so they still
  # populate the scope the next run reads from.
  SCCACHE_GHA_RW_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'READ_ONLY' || 'READ_WRITE' }}
  # The sccache server exits after its idle timeout (600 s by default), and a
  # `--show-stats` that outlives it silently starts a fresh server and reports
  # zeros rather than failing. Any job whose stats step sits behind a long
  # non-compiling step -- the scoped clang-tidy set, the full test suite --
  # would report an unobservable cache. Keeping the server alive for the life
  # of the runner costs nothing: the VM is torn down either way.
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  # Fast, build-free checks. (Static analysis — clang-tidy/cppcheck — is NOT run
  # here: the VS generator silently ignored CMAKE_CXX_CLANG_TIDY/CPPCHECK, so the
  # old "build with static analysis" step was a no-op duplicate of build-test's
  # debug build. Re-enabling real static analysis on Ninja surfaced a backlog of
  # violations, so the broad pass stays advisory in the advisory-unused-checks job
  # of .github/workflows/advisory-checks.yml.
  #
  # A small curated subset DOES block, as the "clang-tidy blocking check set" step
  # inside build-test: bugprone-use-after-move, bugprone-dangling-handle,
  # clang-analyzer-core.CallAndMessage, clang-analyzer-core.uninitialized.*,
  # clang-analyzer-cplusplus.NewDelete*. Each was measured at zero findings in
  # repository-owned files across all 509 project translation units before it was
  # promoted; see .clang-tidy for the candidates that did not qualify, and
  # scripts/run-clang-tidy-blocking.ps1 for the runner.)
  lint:
    name: lint
    runs-on: windows-2022
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.workflow }}-lint-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check clang-format
        run: pwsh -NonInteractive -File scripts/check-format.ps1

      - name: Validate packaging versions
        # The product version is declared once, in project(exosnap VERSION x.y.z),
        # and repeated by hand across roughly sixteen literals in the Chocolatey,
        # WinGet and Scoop packaging. A bump that missed one of them used to publish
        # a package pointing at a release that does not exist, and nothing failed
        # until a submission was rejected. This runs the three validators on their
        # version axis only (no installer hash, no moderation bar -- neither can be
        # true between a bump and the release that produces the bytes).
        run: pwsh -NonInteractive -File scripts/check-packaging-version.ps1

      - name: Validate MSI harvest config
        # Cheap regex check (no build, no WiX required). Asserts Package.wxs
        # is metadata-only and references StagingFiles — prevents anyone from
        # reverting to a hand-maintained file list that silently omits DLLs.
        run: pwsh -NonInteractive -File scripts/validate-msi-harvest.ps1

      - name: Validate privacy allowlist doc sync
        # Build-free (docs/privacy-review.md): the crash-report tag
        # allowlist (crash_scrubber.h) must stay identical to what PRIVACY.md
        # and docs/product-spec.md §14 document as "what is sent".
        run: pwsh -NonInteractive -File scripts/validate-privacy-allowlist.ps1

      - name: Validate network egress inventory
        # Build-free (docs/privacy-review.md): fails if a network
        # primitive or a disallowed host literal appears outside the known
        # GitHub/Sentry call sites, so a new egress point cannot land unnoticed.
        run: pwsh -NonInteractive -File scripts/validate-network-egress.ps1

  # ---------------------------------------------------------------------------
  # Cheap guardrails that block locally and did not block here. Each of them runs
  # in the pre-commit gate on a developer's machine, and a PR from a machine that
  # skipped the hook -- or from a contributor without it -- reached the reviewer
  # with none of them applied. None needs a compiler.
  #
  # The source-hygiene check is scoped to the PR RANGE, not to the checkout. A
  # pull_request checkout is the merge commit with a depth of one; diffing that
  # against nothing scans an empty change set and passes over every line the PR
  # added. The base is fetched to the depth the merge base needs and passed in
  # explicitly.
  #
  # The two workflow linters are pinned by version and by digest, and a missing
  # tool fails the step: a step that skips itself when its tool is absent reports
  # a green check that ran nothing, which is the failure this job exists to
  # prevent in the first place.
  # ---------------------------------------------------------------------------
  guardrails:
    name: guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.workflow }}-guardrails-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Enough history to reach the merge base of the PR. 0 is the whole
          # repository, which is what makes the base reachable on a branch that
          # diverged a while ago; a shallow fetch would leave merge-base with
          # nothing to answer and the hygiene check with nothing to scan.
          fetch-depth: 0

      - name: Assert PowerShell
        # ubuntu-24.04 images carry pwsh already; asserted rather than assumed, so
        # a runner image that drops it fails here with its name instead of later
        # with a shell error. Through the shell's own `-Version`, not a
        # PowerShell expression in single quotes: the step is bash, and bash
        # single quotes are what keeps `$PSVersionTable` from being expanded
        # by bash -- which shellcheck reads, correctly, as a variable that is not.
        run: pwsh -Version

      - name: Check drift (Qt version, Qt setup, SDK paths)
        run: pwsh -NonInteractive -File scripts/check-drift.ps1

      - name: Source hygiene over the PR range
        # Only on a pull_request, where the range is the PR's base against its
        # head: the set of lines this change added, which is the contract the
        # pre-commit hook enforces locally. A tag push or a manual dispatch has no
        # range a change can be attributed to (github.event.before is zeros or
        # absent), and scanning the whole tree there would block a release on the
        # 51-finding backlog in older comments that AGENTS.md names -- a decision
        # about the backlog, not about the tag. Reported below, not enforced.
        if: github.event_name == 'pull_request'
        run: >-
          pwsh -NonInteractive -File scripts/check-source-hygiene.ps1
          -Base ${{ github.event.pull_request.base.sha }}

      - name: Source hygiene backlog (whole tree, report only)
        # Visible on every run so the number is known, never a gate: the backlog
        # is older comments, and a release is not the place it gets paid down.
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: pwsh -NonInteractive -File scripts/check-source-hygiene.ps1 -All

      - name: Pull request title (preflight)
        # The AUTHORITATIVE verdict on the title is pr-policy.yml's, under its own
        # required context; this step is a cost gate, and the two are not the same
        # job. The two workflows cannot wait on each other -- there is no
        # cross-workflow `needs:` -- so without this step a malformed title opened
        # in a brand-new pull request would fail in pr-policy.yml within seconds
        # while the Windows legs, which hang off this job, started anyway. Only
        # the SECOND heavy run (the one after the title correction) would have
        # been saved, and the first one is the expensive one.
        #
        # Not a second implementation of the policy: the same script, the same
        # arguments, the same parser. What this workflow must NOT have is the
        # `edited` trigger that would re-run everything below when the title
        # changes -- see this file's `on:` block.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          pwsh -NonInteractive -File scripts/check-commit-policy.ps1
          -Subject "$PR_TITLE" -PullRequestNumber "$PR_NUMBER" -Only commit-subject

      - name: Prose line lengths over the PR range (advisory)
        # Advisory for the same reason the source-hygiene backlog is: the tree
        # predates the rule, and a branch that adds a paragraph to an already
        # wrapped document wraps it to match. check-prose-lines.ps1 records what
        # has to be true before this loses the switch.
        if: github.event_name == 'pull_request'
        run: >-
          pwsh -NonInteractive -File scripts/check-prose-lines.ps1
          -Advisory -Base ${{ github.event.pull_request.base.sha }}

      - name: Install actionlint (pinned)
        # By version and by SHA-256 of the release archive. A linter fetched as
        # "latest" changes what it flags between two runs of the same workflow.
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive"             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: actionlint
        # No -color: the escape sequences are noise in the Actions log and make
        # the log unreadable through the API.
        run: actionlint

      - name: Install zizmor (pinned)
        env:
          ZIZMOR_VERSION: '1.30.1'
        run: |
          set -euo pipefail
          pipx install "zizmor==${ZIZMOR_VERSION}"
          zizmor --version

      - name: zizmor
        # Offline: the audits that need the GitHub API (stale action refs) are the
        # ones that change answer between two runs of the same workflow. What is
        # left is what can be decided from the file, which is what a guardrail is.
        #
        # High only, for now. The five known high findings (caches restored on tag
        # pushes) carry an inline 'zizmor: ignore' at the step that is the decision,
        # with the reason, so a NEW high finding fails here. The 41 medium findings
        # are a backlog, not a gate: blocking on them today would block on the state
        # of the repository rather than on the change in front of the reviewer.
        run: zizmor --offline --min-severity high .github/workflows

  exo-verify:
    name: exo-verify
    runs-on: windows-2022
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.workflow }}-exo-verify-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: tools/exo-verify
    env:
      EXO_VERIFY_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Provision ffmpeg and ffprobe
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Dev scripts: regression-guard the A/V-sync analyzer against a committed
  # golden clapper clip. This is a Python + SYSTEM-ffmpeg check (the app ships a
  # mux-only FFmpeg without the signalstats/astats filters the analyzer needs),
  # so ffmpeg is provisioned + version-verified explicitly — the runner image
  # does not guarantee it. Not part of build-test; no GPU, no engine build.
  # ---------------------------------------------------------------------------
  dev-scripts:
    name: dev-scripts
    runs-on: windows-2022
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-dev-scripts-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Provision + verify system ffmpeg
        # Explicit install so the job is not silently green/red on runner-image
        # drift. The analyzer's drift math is version-robust (PTS come from a
        # filter graph, not the codec), so a version print is a sufficient pin.
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: A/V-sync analyzer vs golden fixture
        # Regression-guards the analyzer's event detection, its edge location and
        # the drift fit. The budget is intentionally loose: a 4 s clip's residual
        # drift is bounded by the 60 fps frame grid, not by a real A/V budget, and
        # must stay green across ffmpeg-version differences in reported PTS. The
        # real 20 ms budget applies to live multi-hour captures, not this fixture.
        #
        # Five markers, not two: the analyzer refuses a verdict from a reference
        # that cannot carry one, and two markers never can. A two-marker fixture
        # would only ever exercise the path that refusal takes.
        run: >-
          python scripts/dev/av-sync-check.py tests/fixtures/av-sync/clapper-golden.mp4
          --max-drift-ms 25 --expected-markers 5 --json

  # ---------------------------------------------------------------------------
  # Detect whether this PR touches packaging-relevant or build/tooling-relevant
  # paths.
  #   - `packaging` gates the packaging smoke step on the release leg (a
  #     scoped-down slice of the release-candidate pipeline) so it
  #     only runs when it can actually catch something.
  #   - `build` gates the windows-x64-release leg of build-test on PRs (PR-CI
  #     tiering): the debug leg always runs and carries the test suite, so the
  #     release leg — which proves the Release configure/build/link still works
  #     — runs on a PR when anything that can plausibly diverge between Debug
  #     and Release changed. That includes ordinary C++ code, not just build
  #     config: NDEBUG, debug-only assertions, optimization/inlining, and
  #     conditional compilation all produce Release-only breaks that the debug
  #     leg cannot see. Only changes that touch no C++ and no build machinery
  #     (docs, screenshots, packaging-unrelated scripts) skip the release leg.
  #
  # This job runs on EVERY trigger, not just pull_request, even though its
  # outputs are only consulted on pull_request (see build-test-release below).
  # That is deliberate: build-test-release has
  # `needs: changes`, and a job-level `if:` has an implicit `success()` guard
  # unless it names a status-check function. If `changes` were skipped (as it
  # would be on push/tag/dispatch under a plain
  # `if: github.event_name == 'pull_request'`), `needs.changes` would report
  # skipped rather than success, and build-test-release would be skipped too —
  # silently, since a skipped required check still shows green. Keeping this
  # job unconditional means it always reports success outside pull_request (an
  # ~8s ubuntu-latest job), so `needs.changes` is satisfied and the consumers'
  # own event_name clauses are the only thing that decides push/tag/dispatch
  # behavior. The filter outputs themselves are simply not consulted outside
  # pull_request.
  #
  # This job is also, together with lint and dev-scripts, the whole of what a
  # push to main or next now runs, so it remains unconditional even though
  # its outputs gate nothing on those branch pushes.
  # ---------------------------------------------------------------------------
  changes:
    name: detect packaging changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.workflow }}-changes-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            packaging:
              - 'packaging/**'
              - 'scripts/build-release-artifacts.ps1'
              - 'cmake/Vendor*'
              - 'CMakeLists.txt'
              - 'app/CMakeLists.txt'
              - 'apps/updater/CMakeLists.txt'
              - 'third_party/CMakeLists.txt'
              - 'THIRD_PARTY_NOTICES.md'
            # `packaging` is a subset of `build` by construction: the packaging
            # smoke runs on the release leg's build, so a path that arms the
            # smoke has to arm that leg. ci-required checks the subset holds.
            build:
              - 'app/**'
              - 'apps/**'
              - 'libs/**'
              - 'tools/**'
              - 'tests/**'
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - '**/*.cmake'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'packaging/**'
              - 'THIRD_PARTY_NOTICES.md'
              - '.github/workflows/**'
              - 'scripts/build-*'

  # ---------------------------------------------------------------------------
  # build-test was a single job with a 2-way (debug/release) matrix. It is now
  # split into two explicit jobs so the release leg can be gated on PRs via a
  # normal job-level `if:` (the `matrix` context is NOT available in
  # `jobs.<job_id>.if` — only in `name`/`runs-on`/`env`/step-level `if`, per
  # https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
  # — actionlint flags it, and it silently would not have worked). Each job's
  # `name:` is hardcoded to the exact matrix-expanded string GitHub previously
  # showed ("build-test (windows-x64-debug)" / "build-test (windows-x64-release)")
  # so required-status-check matching is unaffected.
  # ---------------------------------------------------------------------------
  build-test-debug:
    name: build-test (windows-x64-debug)
    runs-on: windows-2022
    # Measured over the last 20 runs: median 12 min at a 97-98 % sccache hit
    # rate; worst 71 min on a cold cache with a header change that fanned the
    # scoped clang-tidy set out across the tree (36 min of it). About 1.7x
    # that worst case: a lint-policy change reaches every unit, and its first
    # push is the run this ceiling has to let finish.
    timeout-minutes: 120
    # Not on a branch push: the next commit is the squash of a PR whose own run
    # of this exact job just went green (see "WHAT RUNS WHERE" at the top of this
    # file). Written as a positive list over the events this workflow can see
    # rather than as a negation, so each trigger is decided explicitly:
    #   pull_request      -> first clause
    #   workflow_dispatch -> second clause
    #   push, refs/tags/v* -> third clause  (release gate: full suite)
    #   push, refs/heads/main|next -> no clause matches -> skipped
    #
    # `needs: guardrails` is a cost gate, not a correctness one. guardrails runs
    # in well under a minute on ubuntu and blocks on things a compiler cannot
    # see (drift, source hygiene, actionlint, zizmor); without the dependency a
    # branch that trips one of them still spends ~15 min of Windows runner time
    # proving a build nobody will merge. A job-level `if:` that names no status
    # function carries an implicit success() over `needs`, so a failed guardrails
    # skips this job — and ci-required reads that skip as a failure, because a
    # pull request is not an event where this leg is allowed to skip.
    needs: guardrails
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: ci-${{ github.workflow }}-build-test-debug-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The blocking clang-tidy step below diffs HEAD against HEAD^ to find
          # which translation units a change affects. On a pull_request that first
          # parent is the base branch tip (the checked-out ref is the merge
          # commit); on a push it is the previous commit. Depth 2 is all either
          # needs, and the default depth of 1 would leave HEAD^ unreachable.
          fetch-depth: 2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # 'quick', because the shipping application (app/quick/ExoSnap/Quick, target
      # `exosnap`) is a Qt Quick program. Under the 'base' profile
      # app/CMakeLists.txt's Qt probe fails and the app is silently SKIPPED rather
      # than failing the job -- see .github/actions/setup-qt for what each profile
      # installs and why the two Quick pieces arrive by different routes.
      - name: Install Qt 6
        uses: ./.github/actions/setup-qt
        with:
          profile: quick

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # zizmor: ignore[cache-poisoning] -- restored on tag pushes by decision: a cold release build is ~46 min and the key is scoped to runner image + lock files; revisiting it is an ADR, not a lint fix

      # No frontend flag: there is one frontend. The Qt Quick application and its
      # adapter/QML test targets are the default build.
      - name: Configure (windows-x64-ninja-debug)
        run: cmake --preset windows-x64-ninja-debug -DEXOSNAP_USE_SCCACHE=ON

      - name: Build (windows-x64-ninja-debug)
        run: cmake --build --preset windows-x64-ninja-debug

      # qmllint over every QML module in the tree — the shipping one and the QML
      # test module. Deterministic and fast, and it catches a class of defect no
      # C++ test can: an Accessible attachment on a non-Item, an unresolvable
      # import, a property that does not exist on the declared type. `all_qmllint`
      # rather than the per-module target so a newly added module cannot slip past
      # the gate by not being named here.
      - name: qmllint (all QML modules)
        run: cmake --build build/windows-x64-ninja-debug --target all_qmllint

      # Runs through scripts/run-tests.ps1 (the documented, canonical test entry
      # point — see AGENTS.md) rather than a bare `ctest`, so CI shares the same
      # -ExcludeLabel mechanism as local dev instead of relying solely on the
      # "live" binaries' own GTEST_SKIP self-guard. Two capability test binaries
      # carry LABELS live (real DXGI/GPU queries); this runner has no GPU, so
      # they are excluded here rather than trusted to skip themselves — a future
      # runner-image change (or a new live test that forgets the self-skip)
      # would otherwise fail silently past this gate.
      #
      # `live` and the execution phases are two axes and neither replaces the
      # other. A phase says what KIND of machine a test needs; `live` says the
      # test reads real machine state. The quick.* tests are phase.desktop and run
      # here because an offscreen Qt platform is a desktop surface — except the
      # two that also carry `live` because they need the native platform and the
      # real cursor. Selecting by phase alone would either lose the first group or
      # keep the second.
      - name: Test (windows-x64-ninja-debug)
        run: >-
          pwsh -NonInteractive -File scripts/run-tests.ps1
          -BuildDir build/windows-x64-ninja-debug -Config Debug
          -ExcludeLabel live

      # Blocking static analysis. Deliberately a step inside build-test-debug
      # rather than a job of its own: build-test-debug is already a required
      # check, so the required status-check set does not change (a brand-new
      # job would have to be added to branch protection to block anything at
      # all, and an unrequired one that fails is just noise — the same trap
      # advisory-unused-checks documents in advisory-checks.yml). It also reuses the
      # compile_commands.json the Ninja debug configure already wrote — the
      # Release preset exports none, which is why this step lives in
      # build-test-debug and not build-test-release.
      #
      # Scope is what the change touches: the changed translation units plus every
      # translation unit that includes a changed header, resolved from Ninja's own
      # recorded dependency graph. A full-tree pass of this check set measures
      # ~5.6 CPU-hours — nearly all of it clang re-parsing Qt headers — so the full
      # form stays a local / on-demand operation and CI runs the scoped one.
      # Analysing one Qt-heavy translation unit costs ~44 s, nearly all of it
      # clang re-parsing the same Qt headers, and a header change fans the
      # scoped set out to well over a hundred units. The cache keys each unit
      # on its full recorded input set, so the units a follow-up push did not
      # touch replay their stored verdict instead of being analysed again --
      # which is what makes the second and later pushes of a review cycle
      # cheap. The first push of a header-changing PR still analyses
      # everything that header reaches: those inputs genuinely changed.
      #
      # Restored by prefix, saved under a run-unique key, because a cache entry
      # cannot be overwritten once written. GitHub evicts by age and by the
      # repository's cache budget; entries are a few hundred bytes each, so the
      # set is never what fills it.
      - name: Restore clang-tidy result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] -- restored on tag pushes by decision: a cold release build is ~46 min and the key is scoped to runner image + lock files; revisiting it is an ADR, not a lint fix
        with:
          path: ${{ runner.temp }}/clang-tidy-cache
          key: clang-tidy-blocking-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clang-tidy-blocking-${{ runner.os }}-

      - name: clang-tidy blocking check set (windows-x64-ninja-debug)
        run: >-
          pwsh -NonInteractive -File scripts/run-clang-tidy-blocking.ps1
          -BuildDir build/windows-x64-ninja-debug -Base HEAD^
          -CacheDir "${{ runner.temp }}/clang-tidy-cache"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload test logs (windows-x64-ninja-debug)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctest-logs-windows-x64-ninja-debug
          path: build/windows-x64-ninja-debug/Testing/Temporary/

  build-test-release:
    name: build-test (windows-x64-release)
    runs-on: windows-2022
    # Measured over the last 20 runs: median 7 min at a 98 % sccache hit rate,
    # worst 34 min on a cold cache. About 2x that worst case.
    timeout-minutes: 60
    # guardrails for the same cost reason as build-test-debug; see the comment there.
    needs: [changes, guardrails]
    # PR-CI tiering: this leg proves the Release configure/build/link still
    # works, so on a PR it runs when the `changes` job flags a C++/build/
    # packaging/tooling-relevant path (see the `changes` job above for the
    # filter) — and on a PR it stops after the build (see the Test step's own
    # condition): the debug leg already ran the full suite, and Debug/Release
    # divergence is overwhelmingly a compile/link phenomenon. Like
    # build-test-debug it does NOT run on a branch push, but it does run in full,
    # including tests, on a v* tag and on workflow_dispatch, where the filter
    # output is irrelevant and never consulted.
    #
    #   pull_request          -> first clause, and only when `build` matched
    #   workflow_dispatch     -> second clause
    #   push, refs/tags/v*    -> third clause  (release gate: full suite)
    #   push, refs/heads/main|next -> no clause matches -> skipped
    #
    # This job has `needs: changes`, and a job-level `if:` carries an implicit
    # success() guard unless it names a status-check function — so a SKIPPED
    # `changes` would skip this job silently regardless of what the expression
    # below says. That is why `changes` runs unconditionally (see its own
    # comment); do not re-narrow it.
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.build == 'true') ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: ci-${{ github.workflow }}-build-test-release-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # 'quick': same reason as build-test-debug's Install Qt 6 step above.
      - name: Install Qt 6
        uses: ./.github/actions/setup-qt
        with:
          profile: quick

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        # zizmor: ignore[cache-poisoning] -- restored on tag pushes by decision: a cold release build is ~46 min and the key is scoped to runner image + lock files; revisiting it is an ADR, not a lint fix

      # A Release build is the only configuration that compiles out the harness
      # code paths, so the Debug leg alone would miss exactly the guards that
      # differ between the two.
      - name: Configure (windows-x64-ninja-release)
        run: cmake --preset windows-x64-ninja-release -DEXOSNAP_USE_SCCACHE=ON

      - name: Build (windows-x64-ninja-release)
        run: cmake --build --preset windows-x64-ninja-release

      # Runs through scripts/run-tests.ps1 (the documented, canonical test entry
      # point — see AGENTS.md) rather than a bare `ctest`, so CI shares the same
      # -ExcludeLabel mechanism as local dev instead of relying solely on the
      # "live" binaries' own GTEST_SKIP self-guard. Two capability test binaries
      # carry LABELS live (real DXGI/GPU queries); this runner has no GPU, so
      # they are excluded here rather than trusted to skip themselves — a future
      # runner-image change (or a new live test that forgets the self-skip)
      # would otherwise fail silently past this gate.
      #
      # `live` and the execution phases are two axes and neither replaces the
      # other. A phase says what KIND of machine a test needs; `live` says the
      # test reads real machine state. The quick.* tests are phase.desktop and run
      # here because an offscreen Qt platform is a desktop surface — except the
      # two that also carry `live` because they need the native platform and the
      # real cursor. Selecting by phase alone would either lose the first group or
      # keep the second.
      #
      # Not on pull_request: the debug leg already carried the full suite, and
      # this leg's PR-tier job is configure/compile/link (see the job comment).
      # Tags and manual dispatches are the release gate and run the Release
      # suite in full.
      - name: Test (windows-x64-ninja-release)
        if: github.event_name != 'pull_request'
        run: >-
          pwsh -NonInteractive -File scripts/run-tests.ps1
          -BuildDir build/windows-x64-ninja-release -Config Release
          -ExcludeLabel live

      # Packaging smoke on the build this job just produced. The candidate
      # workflow runs the full package gate (install -> audit -> MSI -> content
      # assertion -> MSI smoke -> ZIP smoke) on explicit dispatch. This is the
      # fastest subset that still catches those, on every pull request that
      # touches a packaging-relevant path (the `changes` job's `packaging`
      # filter):
      #
      #   - cmake --install into a pruned staging tree (identical pruning rules)
      #   - presence / absence / leak / exe-metadata validation of that tree
      #   - the dumpbin /dependents static runtime-dependency audit
      #   - portable ZIP creation + the isolated launch smoke (app exe + updater
      #     exe, both via SetErrorMode + dialog-sentinel)
      #
      # -SkipConfigure: configured above. -SkipMsi: the WiX/MSI build, the MSI
      # content assertion and the MSI smoke need the WiX Toolset and add several
      # minutes for a package format the portable-ZIP path already exercises
      # structurally (same staging tree, same harvest source); they stay with
      # the release gate. Same preset as the release gate, so what this smokes
      # is the build path that ships.
      #
      # A step here rather than its own job: the job it would need is this one
      # again -- checkout, MSVC, Qt, sccache, configure, build -- on a second
      # runner, for a five-minute smoke of the build this runner already holds.
      - name: Install, package and smoke-test (release-gate subset)
        if: github.event_name == 'pull_request' && needs.changes.outputs.packaging == 'true'
        run: pwsh -NonInteractive -File scripts/build-release-artifacts.ps1 -SkipConfigure -Preset windows-x64-ninja-release -SkipMsi

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload test logs (windows-x64-ninja-release)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctest-logs-windows-x64-ninja-release
          path: build/windows-x64-ninja-release/Testing/Temporary/

      - name: Upload packaging validation report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.packaging == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaging-smoke-report
          path: |
            .workspace/release/*/validation-report.md
            .workspace/release/*/artifact-manifest.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The one required check.
  #
  # Naming the heavy jobs directly in branch protection looks stricter than it
  # is: a job that skips itself reports conclusion "skipped", and GitHub counts
  # a skipped required check as satisfied. "build-test (windows-x64-release)"
  # is required today and skips on any pull request whose diff misses the
  # `build` filter — so the rule it is listed under can be satisfied by a job
  # that never ran. The inverse mistake is just as easy: requiring a
  # conditional job that reports nothing at all leaves the rule permanently
  # unsatisfiable.
  #
  # So exactly one context is required, and the policy lives here, in the
  # repository, where it is reviewed with the code. This job always runs and
  # always reports, and it decides per job whether a non-success result is the
  # documented behaviour for this event or a failure being waved through.
  # ---------------------------------------------------------------------------
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - guardrails
      - exo-verify
      - dev-scripts
      - changes
      - build-test-debug
      - build-test-release
    steps:
      - name: Evaluate the required set
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUILD_FILTER: ${{ needs.changes.outputs.build }}
          PACKAGING_FILTER: ${{ needs.changes.outputs.packaging }}
          R_LINT: ${{ needs.lint.result }}
          R_GUARDRAILS: ${{ needs.guardrails.result }}
          R_EXO_VERIFY: ${{ needs.exo-verify.result }}
          R_DEV_SCRIPTS: ${{ needs.dev-scripts.result }}
          R_CHANGES: ${{ needs.changes.result }}
          R_DEBUG: ${{ needs.build-test-debug.result }}
          R_RELEASE: ${{ needs.build-test-release.result }}
        run: |
          set -euo pipefail
          failed=0

          # $1 job label, $2 its result, $3 "skip-ok" when this event allows a
          # skip, anything else when it does not.
          require() {
            local name="$1" result="$2" skip_ok="$3"
            if [ "$result" = "success" ]; then
              echo "ok       $name"
            elif [ "$result" = "skipped" ] && [ "$skip_ok" = "skip-ok" ]; then
              echo "skipped  $name (expected for this event)"
            else
              echo "FAILED   $name: result=$result"
              failed=1
            fi
          }

          is_tag=false
          case "$REF" in refs/tags/v*) is_tag=true ;; esac

          # These five run on every trigger; a skip is a workflow defect.
          require lint                "$R_LINT"           must-run
          require guardrails          "$R_GUARDRAILS"     must-run
          require exo-verify          "$R_EXO_VERIFY"      must-run
          require dev-scripts         "$R_DEV_SCRIPTS"    must-run
          require "detect changes"    "$R_CHANGES"        must-run

          # The heavy legs deliberately do not re-run on branch pushes. A next
          # merge passed pull request CI; main advances only to release bytes
          # that passed the candidate gates. Other events must run the legs.
          debug_skip=not-allowed
          if [ "$EVENT" = "push" ] && [ "$is_tag" = false ]; then debug_skip=skip-ok; fi
          require "build-test (debug)" "$R_DEBUG" "$debug_skip"

          release_skip=not-allowed
          if [ "$EVENT" = "push" ] && [ "$is_tag" = false ]; then release_skip=skip-ok; fi
          if [ "$EVENT" = "pull_request" ] && [ "$BUILD_FILTER" != "true" ]; then release_skip=skip-ok; fi
          require "build-test (release)" "$R_RELEASE" "$release_skip"

          # The packaging smoke is a step of the release leg, armed by the
          # `packaging` filter, and that leg is armed by the `build` filter. The
          # smoke can therefore only run if every packaging path is also a build
          # path -- a relation the filters state and nothing enforces. Checked
          # here: a packaging change whose release leg was allowed to skip is a
          # filter defect, not a pass.
          if [ "$EVENT" = "pull_request" ] && [ "$PACKAGING_FILTER" = "true" ] && [ "$BUILD_FILTER" != "true" ]; then
            echo "FAILED   packaging filter matched but the build filter did not: the packaging smoke could not have run"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::A job in the required set did not pass, and its result is not an expected skip for this event."
            exit 1
          fi
          echo "All required jobs accounted for."
