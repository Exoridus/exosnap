name: CI

on:
  # Run on the default branch and release tags directly, and on every pull
  # request. Feature branches are covered by their PR, so a plain branch push
  # no longer triggers a second, redundant run alongside the pull_request run.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# NOTE: concurrency is intentionally set per-JOB below, not at the workflow
# level. A workflow-level `concurrency:` cancels the entire run — every job in
# it — the instant a newer commit lands on the same ref, regardless of that
# job's own continue-on-error setting. advisory-unused-checks is the slowest
# job here (full Ninja debug build + clang-tidy + cppcheck, up to 45 min) and
# is advisory-only; on a fast sequence of pushes to main it was routinely still
# running when the next commit's workflow run started, so the whole run
# (including advisory-unused-checks) got torn down and it reported conclusion
# "cancelled" — which GitHub renders as a failed/incomplete check on an
# otherwise-green commit ("Some checks were not successful"). Per-job
# concurrency groups (below) preserve the "cancel stale runs on the same
# PR/branch" behavior for the jobs that benefit from it, while leaving
# advisory-unused-checks out of any cancelling group so it always reaches a
# real conclusion (success, or a genuine failure caught by continue-on-error).

# Use sccache (GitHub Actions cache backend) as the MSVC compiler launcher to
# cache compilation across runs. This requires the Ninja generator — the Visual
# Studio / MSBuild generator ignores CMAKE_CXX_COMPILER_LAUNCHER. /Z7 (embedded
# debug info) is already the project default, so the object cache has no PDB
# contention. Ninja + MSVC needs the dev-cmd environment for cl.exe.
env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Fast, build-free checks. (Static analysis — clang-tidy/cppcheck — is NOT run
  # here: the VS generator silently ignored CMAKE_CXX_CLANG_TIDY/CPPCHECK, so the
  # old "build with static analysis" step was a no-op duplicate of build-test's
  # debug build. Re-enabling real static analysis on Ninja surfaced a backlog of
  # violations, so the broad pass stays advisory in advisory-unused-checks below.
  #
  # A small curated subset DOES block, as the "clang-tidy blocking check set" step
  # inside build-test: bugprone-use-after-move, bugprone-dangling-handle,
  # clang-analyzer-core.CallAndMessage, clang-analyzer-core.uninitialized.*,
  # clang-analyzer-cplusplus.NewDelete*. Each was measured at zero findings in
  # repository-owned files across all 509 project translation units before it was
  # promoted; see .clang-tidy for the candidates that did not qualify, and
  # scripts/run-clang-tidy-blocking.ps1 for the runner.)
  lint:
    name: lint
    runs-on: windows-2022
    concurrency:
      group: ci-${{ github.workflow }}-lint-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check clang-format
        run: pwsh -NonInteractive -File scripts/check-format.ps1

      - name: Validate WinGet manifest
        run: pwsh -NonInteractive -File scripts/validate-winget-manifest.ps1

      - name: Validate MSI harvest config
        # Cheap regex check (no build, no WiX required). Asserts Package.wxs
        # is metadata-only and references StagingFiles — prevents anyone from
        # reverting to a hand-maintained file list that silently omits DLLs.
        run: pwsh -NonInteractive -File scripts/validate-msi-harvest.ps1

      - name: Validate privacy allowlist doc sync
        # Build-free (docs/privacy-review.md, ADR 0045): the crash-report tag
        # allowlist (crash_scrubber.h) must stay identical to what PRIVACY.md
        # and docs/product-spec.md §14 document as "what is sent".
        run: pwsh -NonInteractive -File scripts/validate-privacy-allowlist.ps1

      - name: Validate network egress inventory
        # Build-free (docs/privacy-review.md, ADR 0045): fails if a network
        # primitive or a disallowed host literal appears outside the known
        # GitHub/Sentry call sites, so a new egress point cannot land unnoticed.
        run: pwsh -NonInteractive -File scripts/validate-network-egress.ps1

  # ---------------------------------------------------------------------------
  # Dev scripts: regression-guard the A/V-sync analyzer against a committed
  # golden clapper clip. This is a Python + SYSTEM-ffmpeg check (the app ships a
  # mux-only FFmpeg without the signalstats/astats filters the analyzer needs),
  # so ffmpeg is provisioned + version-verified explicitly — the runner image
  # does not guarantee it. Not part of build-test; no GPU, no engine build.
  # ---------------------------------------------------------------------------
  dev-scripts:
    name: dev-scripts
    runs-on: windows-2022
    concurrency:
      group: ci-${{ github.workflow }}-dev-scripts-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Provision + verify system ffmpeg
        # Explicit install so the job is not silently green/red on runner-image
        # drift. The analyzer's drift math is version-robust (PTS come from a
        # filter graph, not the codec), so a version print is a sufficient pin.
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: A/V-sync analyzer vs golden fixture
        # Regression-guards the analyzer's event detection + drift math. The
        # budget is intentionally loose: a 4 s clip's residual drift is bounded by
        # frame quantization (~one 60 fps frame), not a real A/V budget, and must
        # stay green across ffmpeg-version differences in reported PTS. The real
        # 20 ms budget applies to live 2 h captures, not this fixture.
        run: python scripts/dev/av-sync-check.py tests/fixtures/av-sync/clapper-golden.mp4 --max-drift-ms 45 --json

  # ---------------------------------------------------------------------------
  # Advisory unused-code / import checks (PHASE B — NEVER blocks the PR)
  #
  # Surfaces stale functions, unused includes, and redundant declarations for
  # human review. Heavy Qt false-positive risk: Qt signals/slots invoked via
  # QMetaObject / connect() string form, moc-generated headers. Do NOT promote
  # any finding to blocking without a triage pass that filters Qt noise.
  #
  # Uses: clang-tidy misc-include-cleaner / misc-unused-* /
  #       readability-redundant-declaration  (advisory only, not in WarningsAsErrors)
  #     + cppcheck --enable=unusedFunction (whole-program, no --error-exitcode)
  # ---------------------------------------------------------------------------
  advisory-unused-checks:
    name: advisory-unused-checks
    runs-on: windows-2022
    continue-on-error: true  # NEVER block the PR — informational only
    # No job here had an explicit timeout, so a hang (observed: some step stalls
    # indefinitely rather than failing) ran to GitHub's default 6h job ceiling —
    # eating runner time and, worse, blocking `gh pr merge --auto` the whole time
    # (an in-progress check blocks auto-merge regardless of continue-on-error,
    # which only governs how a *completed* failure is treated). 45 min is generous
    # for a full Qt+Ninja debug build plus the clang-tidy/cppcheck advisory passes.
    timeout-minutes: 45
    # Deliberately NOT given a `concurrency:` group (see the note at the top of
    # this file): this job is the slowest in the workflow, so it was routinely
    # still in flight when the next push's run started, and a workflow-level
    # concurrency group used to cancel it mid-run — reported as conclusion
    # "cancelled", which reads as a failed check on an otherwise-green commit.
    # Leaving it ungrouped means every push gets its own independent run that
    # always reaches a real conclusion; the tradeoff is it can run more than
    # one instance in parallel on rapid pushes, which is acceptable for an
    # advisory, continue-on-error, time-boxed job.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtsvg'
          cache: true

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      # Configure the Ninja debug preset with CMAKE_EXPORT_COMPILE_COMMANDS=ON
      # (already set in CMakePresets.json for windows-x64-ninja-debug).
      # compile_commands.json is required by misc-include-cleaner.
      - name: Configure (windows-x64-ninja-debug)
        run: cmake --preset windows-x64-ninja-debug -DEXOSNAP_USE_SCCACHE=ON

      - name: Build (windows-x64-ninja-debug)
        run: cmake --build --preset windows-x64-ninja-debug

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      # clang-tidy advisory pass: misc-include-cleaner, misc-unused-*, readability-redundant-declaration.
      # These checks are in .clang-tidy Checks but excluded from WarningsAsErrors, so they
      # produce warnings (exit 0) not errors. The step is informational.
      - name: clang-tidy advisory checks
        continue-on-error: true
        shell: pwsh
        run: |
          $clangTidy = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022" `
            -Recurse -Filter 'clang-tidy.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Llvm\\x64\\bin\\' } |
            Select-Object -ExpandProperty FullName -First 1
          if (-not $clangTidy) {
            Write-Host "clang-tidy not found in VS LLVM; falling back to PATH"
            $clangTidy = (Get-Command clang-tidy -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $clangTidy) {
            Write-Host "::warning::clang-tidy not available — advisory unused-code check skipped"
            exit 0
          }
          $srcFiles = @(git ls-files -- 'libs/' 'app/' 'tests/' | Where-Object { $_ -match '\.(cpp|h)$' })
          if (-not $srcFiles) { Write-Host "No tracked C++ source files found."; exit 0 }
          Write-Host "Running advisory clang-tidy on $($srcFiles.Count) source files..."
          # Run with -p pointing at the Ninja debug compile_commands.json.
          # WarningsAsErrors in .clang-tidy excludes misc-* and readability-redundant-declaration
          # so only the advisory checks produce warnings (not errors) — exit code stays 0.
          # -clang-analyzer-*: .clang-tidy enables a few path-sensitive analyser checks for the
          # blocking gate in build-test. They are irrelevant to this unused-code pass and would
          # multiply the cost of an already long serial run, so they are switched back off here.
          & $clangTidy -p build/windows-x64-ninja-debug --checks=-clang-analyzer-* @srcFiles 2>&1 |
            Tee-Object -Variable tidyOutput | Out-String | Write-Host
          $advisoryCounts = @($tidyOutput -join "`n" | Select-String -Pattern '(misc-include-cleaner|misc-unused-using-decls|misc-unused-parameters|misc-unused-alias-decls|readability-redundant-declaration)' -AllMatches).Matches.Count
          Write-Host "::notice::clang-tidy advisory findings: $advisoryCounts (misc-include-cleaner / misc-unused-* / readability-redundant-declaration)"

      # cppcheck --enable=unusedFunction: whole-program, no --error-exitcode.
      - name: cppcheck unusedFunction (advisory)
        continue-on-error: true
        shell: pwsh
        run: |
          $cppcheck = Get-ChildItem -LiteralPath "${env:ProgramFiles}\Cppcheck" `
            -Filter 'cppcheck.exe' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName -First 1
          if (-not $cppcheck) { $cppcheck = (Get-Command cppcheck -ErrorAction SilentlyContinue)?.Source }
          if (-not $cppcheck) {
            # Install cppcheck via winget if not present on the runner
            winget install --id Cppcheck.Cppcheck --silent --accept-source-agreements --accept-package-agreements 2>&1 | Out-Null
            $cppcheck = Get-ChildItem -LiteralPath "${env:ProgramFiles}\Cppcheck" `
              -Filter 'cppcheck.exe' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $cppcheck) {
            Write-Host "::warning::cppcheck not available — advisory unusedFunction check skipped"
            exit 0
          }
          Write-Host "Running cppcheck --enable=unusedFunction (advisory, no --error-exitcode)..."
          $findings = & $cppcheck `
            --enable=unusedFunction --std=c++20 --inline-suppr `
            --suppressions-list=.cppcheck-suppress --library=windows --library=qt -q `
            -I libs/recorder_core/include -I libs/capability/include `
            -i libs/update/third_party libs app 2>&1 |
            Where-Object { $_ -match '\(unusedFunction\)' }
          $count = @($findings).Count
          Write-Host "::notice::cppcheck unusedFunction candidates: $count (advisory — review Qt slots/callbacks before acting)"
          if ($count -gt 0) {
            $findings | Select-Object -First 40 | ForEach-Object { Write-Host "  $_" }
            if ($count -gt 40) { Write-Host "  ... ($($count - 40) more)" }
          }

  # ---------------------------------------------------------------------------
  # Detect whether this PR touches packaging-relevant or build/tooling-relevant
  # paths.
  #   - `packaging` gates the packaging-smoke job below (a scoped-down slice of
  #     the release-candidate pipeline, ADR 0037) so it only runs when it can
  #     actually catch something.
  #   - `build` gates the windows-x64-release leg of build-test on PRs (PR-CI
  #     tiering): the debug leg always runs and carries the test suite, so the
  #     release leg — which mainly proves the Release configure/build/link
  #     still works — only needs to run on a PR when something that could
  #     plausibly break it changed (CMake config, packaging, workflow files, or
  #     the release build script).
  #
  # This job runs on EVERY trigger, not just pull_request, even though its
  # outputs are only consulted on pull_request (see build-test-release and
  # packaging-smoke below). That is deliberate: build-test-release has
  # `needs: changes`, and a job-level `if:` has an implicit `success()` guard
  # unless it names a status-check function. If `changes` were skipped (as it
  # would be on push/tag/dispatch under a plain
  # `if: github.event_name == 'pull_request'`), `needs.changes` would report
  # skipped rather than success, and build-test-release would be skipped too —
  # silently, since a skipped required check still shows green. Keeping this
  # job unconditional means it always reports success outside pull_request (an
  # ~8s ubuntu-latest job), so `needs.changes` is satisfied and the consumers'
  # own `github.event_name != 'pull_request' ||` clause is the only thing that
  # decides push/tag/dispatch behavior. The filter outputs themselves are
  # simply not consulted outside pull_request.
  # ---------------------------------------------------------------------------
  changes:
    name: detect packaging changes
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-changes-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            packaging:
              - 'packaging/**'
              - 'scripts/build-release-artifacts.ps1'
              - 'cmake/Vendor*'
              - 'CMakeLists.txt'
              - 'app/CMakeLists.txt'
              - 'apps/updater/CMakeLists.txt'
              - 'third_party/CMakeLists.txt'
              - 'THIRD_PARTY_NOTICES.md'
            build:
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - '**/*.cmake'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'packaging/**'
              - '.github/workflows/**'
              - 'scripts/build-*'

  # ---------------------------------------------------------------------------
  # build-test was a single job with a 2-way (debug/release) matrix. It is now
  # split into two explicit jobs so the release leg can be gated on PRs via a
  # normal job-level `if:` (the `matrix` context is NOT available in
  # `jobs.<job_id>.if` — only in `name`/`runs-on`/`env`/step-level `if`, per
  # https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
  # — actionlint flags it, and it silently would not have worked). Each job's
  # `name:` is hardcoded to the exact matrix-expanded string GitHub previously
  # showed ("build-test (windows-x64-debug)" / "build-test (windows-x64-release)")
  # so required-status-check matching is unaffected.
  # ---------------------------------------------------------------------------
  build-test-debug:
    name: build-test (windows-x64-debug)
    runs-on: windows-2022
    concurrency:
      group: ci-${{ github.workflow }}-build-test-debug-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The blocking clang-tidy step below diffs HEAD against HEAD^ to find
          # which translation units a change affects. On a pull_request that first
          # parent is the base branch tip (the checked-out ref is the merge
          # commit); on a push it is the previous commit. Depth 2 is all either
          # needs, and the default depth of 1 would leave HEAD^ unreachable.
          fetch-depth: 2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtsvg'
          cache: true

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure (windows-x64-ninja-debug)
        run: cmake --preset windows-x64-ninja-debug -DEXOSNAP_USE_SCCACHE=ON

      - name: Build (windows-x64-ninja-debug)
        run: cmake --build --preset windows-x64-ninja-debug

      # Runs through scripts/run-tests.ps1 (the documented, canonical test entry
      # point — see AGENTS.md) rather than a bare `ctest`, so CI shares the same
      # -ExcludeLabel mechanism as local dev instead of relying solely on the
      # "live" binaries' own GTEST_SKIP self-guard. Two capability test binaries
      # carry LABELS live (real DXGI/GPU queries); this runner has no GPU, so
      # they are excluded here rather than trusted to skip themselves — a future
      # runner-image change (or a new live test that forgets the self-skip)
      # would otherwise fail silently past this gate.
      - name: Test (windows-x64-ninja-debug)
        run: >-
          pwsh -NonInteractive -File scripts/run-tests.ps1
          -BuildDir build/windows-x64-ninja-debug -Config Debug
          -ExcludeLabel live

      # Blocking static analysis. Deliberately a step inside build-test-debug
      # rather than a job of its own: build-test-debug is already a required
      # check, so the required status-check set does not change (a brand-new
      # job would have to be added to branch protection to block anything at
      # all, and an unrequired one that fails is just noise — the same trap
      # advisory-unused-checks documents above). It also reuses the
      # compile_commands.json the Ninja debug configure already wrote — the
      # Release preset exports none, which is why this step lives in
      # build-test-debug and not build-test-release.
      #
      # Scope is what the change touches: the changed translation units plus every
      # translation unit that includes a changed header, resolved from Ninja's own
      # recorded dependency graph. A full-tree pass of this check set measures
      # ~5.6 CPU-hours — nearly all of it clang re-parsing Qt headers — so the full
      # form stays a local / on-demand operation and CI runs the scoped one.
      - name: clang-tidy blocking check set (windows-x64-ninja-debug)
        run: >-
          pwsh -NonInteractive -File scripts/run-clang-tidy-blocking.ps1
          -BuildDir build/windows-x64-ninja-debug -Base HEAD^

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload test logs (windows-x64-ninja-debug)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctest-logs-windows-x64-ninja-debug
          path: build/windows-x64-ninja-debug/Testing/Temporary/

  build-test-release:
    name: build-test (windows-x64-release)
    runs-on: windows-2022
    needs: changes
    # PR-CI tiering: this leg mainly proves the Release configure/build/link
    # still works, so on a PR it only runs when the `changes` job flags a
    # build/packaging/tooling-relevant path (see the `changes` job above for
    # the filter). It always runs on push (main) and tags, matching current
    # behavior there exactly: the event_name clause short-circuits before
    # needs.changes.outputs.build is ever consulted. This only works because
    # `changes` (above) runs unconditionally and therefore always succeeds
    # outside pull_request — a skipped `needs` job would otherwise skip this
    # job too via the implicit success() guard on job-level `if:`.
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.build == 'true'
    concurrency:
      group: ci-${{ github.workflow }}-build-test-release-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtsvg'
          cache: true

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure (windows-x64-ninja-release)
        run: cmake --preset windows-x64-ninja-release -DEXOSNAP_USE_SCCACHE=ON

      - name: Build (windows-x64-ninja-release)
        run: cmake --build --preset windows-x64-ninja-release

      # Runs through scripts/run-tests.ps1 (the documented, canonical test entry
      # point — see AGENTS.md) rather than a bare `ctest`, so CI shares the same
      # -ExcludeLabel mechanism as local dev instead of relying solely on the
      # "live" binaries' own GTEST_SKIP self-guard. Two capability test binaries
      # carry LABELS live (real DXGI/GPU queries); this runner has no GPU, so
      # they are excluded here rather than trusted to skip themselves — a future
      # runner-image change (or a new live test that forgets the self-skip)
      # would otherwise fail silently past this gate.
      - name: Test (windows-x64-ninja-release)
        run: >-
          pwsh -NonInteractive -File scripts/run-tests.ps1
          -BuildDir build/windows-x64-ninja-release -Config Release
          -ExcludeLabel live

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload test logs (windows-x64-ninja-release)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctest-logs-windows-x64-ninja-release
          path: build/windows-x64-ninja-release/Testing/Temporary/

  # ---------------------------------------------------------------------------
  # Packaging smoke (PR-CI only; gated on packaging-relevant path changes,
  # see the `changes` job above). ADR 0037 established the full release-gate
  # pipeline (install -> audit -> MSI -> content assertion -> MSI smoke -> ZIP
  # smoke) in release-candidate.yml, but that workflow only runs on version
  # tags and release/** branches — harvest-fragment regressions, new runtime
  # DLLs windeployqt fails to stage, or leaked dev-tree files are invisible
  # until the release tag is pushed. This job runs the fastest subset of that
  # pipeline that still catches those regressions:
  #
  #   - cmake --install into a pruned staging tree (identical pruning rules)
  #   - presence / absence / leak / exe-metadata validation of that tree
  #   - the dumpbin /dependents static runtime-dependency audit
  #   - portable ZIP creation + the isolated launch smoke (app exe + updater
  #     exe, both via SetErrorMode + dialog-sentinel)
  #
  # It deliberately skips the WiX/MSI build, the MSI content assertion, and
  # the MSI smoke (-SkipMsi): those need the WiX Toolset installed and add
  # several minutes for a package format the portable-ZIP path already
  # exercises structurally (same staging tree, same harvest source). It also
  # builds from the Ninja release preset (sccache-cacheable, shared with the
  # build-test job's release leg above) rather than the canonical VS-generator
  # release preset the RC pipeline uses — the VS/MSBuild generator ignores
  # CMAKE_CXX_COMPILER_LAUNCHER, which would mean a from-scratch compile on
  # every PR. build-release-artifacts.ps1 takes a -Preset parameter (default
  # 'windows-x64-release', unchanged for the RC pipeline) and resolves the
  # built exe under either generator's output layout.
  # ---------------------------------------------------------------------------
  packaging-smoke:
    name: packaging-smoke
    needs: changes
    # PR-CI only (see the comment above). Now that `changes` runs on every
    # trigger (not just pull_request — see its own comment above), its
    # `packaging` output reflects a real push/tag diff outside pull_request
    # too, so this needs its own explicit event_name guard to stay PR-only;
    # without it, a push to main that happens to touch a packaging-relevant
    # path would start running this job there as well, which is not the
    # intended behavior (release-candidate.yml is the packaging gate for
    # tags/release branches instead).
    if: github.event_name == 'pull_request' && needs.changes.outputs.packaging == 'true'
    runs-on: windows-2022
    concurrency:
      group: ci-${{ github.workflow }}-packaging-smoke-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtsvg'
          cache: true

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure (windows-x64-ninja-release)
        run: cmake --preset windows-x64-ninja-release -DEXOSNAP_USE_SCCACHE=ON

      # -SkipConfigure: configured above. -SkipMsi: WiX/MSI is out of scope for
      # this PR-CI subset (release-candidate.yml is the release gate for that).
      - name: Build, install, and smoke-test packaging (release-gate subset)
        run: pwsh -NonInteractive -File scripts/build-release-artifacts.ps1 -SkipConfigure -Preset windows-x64-ninja-release -SkipMsi

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload packaging validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaging-smoke-report
          path: |
            .workspace/release/*/validation-report.md
            .workspace/release/*/artifact-manifest.json
          if-no-files-found: warn
