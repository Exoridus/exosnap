name: Crash-Capture Build

# Validates the EXOSNAP_ENABLE_CRASH_CAPTURE=ON build so the crash strand cannot
# silently break on main. The ON build fetches and compiles sentry-native 0.15.0
# + Crashpad + mini_chromium from source — that is slow (~10-20 min), so this job
# is deliberately NOT part of the per-PR `ci.yml`. It is gated to:
#
#   - push to `main`          (catch breakage the moment it lands)
#   - workflow_dispatch       (manual on-demand validation)
#   - PRs labeled `crash-capture` (opt-in heavy check when touching the strand)
#   - PRs that touch crash-capture-relevant paths (auto, via the `changes` job)
#
# EXOSNAP_OFFICIAL_BUILD stays OFF here, so NO secrets are required: the Sentry
# DSN is not compiled in and the ed25519 update public key is not needed. This
# job only proves the crash-capture code path configures, builds, and produces
# crashpad_handler.exe. The DSN + signed-update key are exercised only by the
# release pipeline, which carries the maintainer secrets.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: crash-capture-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # PR-CI tiering: this build is slow (10-20 min, fetches+builds sentry-native
  # from source) so it must not run unconditionally on every PR. It already
  # has an opt-in path (the `crash-capture` label, for reviewing changes
  # elsewhere that a human suspects might affect the strand); this adds an
  # automatic path so a PR that actually touches the crash-capture code, its
  # CMake wiring, or this workflow file doesn't rely on someone remembering to
  # apply the label.
  #
  # This job runs on EVERY trigger, not just pull_request, even though its
  # output is only consulted on pull_request (see crash-capture-build below).
  # crash-capture-build has `needs: changes`, and a job-level `if:` has an
  # implicit `success()` guard unless it names a status-check function; if
  # `changes` were skipped (as it would be on push/dispatch under a plain
  # `if: github.event_name == 'pull_request'`), `needs.changes` would report
  # skipped rather than success and crash-capture-build would be skipped too —
  # silently, matching green. Keeping this job unconditional means it always
  # reports success outside pull_request (an ubuntu-latest paths-filter job),
  # so `needs.changes` is satisfied and crash-capture-build's own
  # `github.event_name != 'pull_request' ||` clause is the only thing that
  # decides push/dispatch behavior; the filter output itself is simply not
  # consulted outside pull_request.
  changes:
    name: detect crash-capture changes
    runs-on: ubuntu-latest
    outputs:
      crash_capture: ${{ steps.filter.outputs.crash_capture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            crash_capture:
              - 'libs/crash_capture/**'
              - 'cmake/VendorSentry.cmake'
              - 'app/CMakeLists.txt'
              - 'CMakeLists.txt'
              - '.github/workflows/crash-capture-build.yml'

  crash-capture-build:
    name: crash-capture-build (ON)
    runs-on: windows-2022
    needs: changes
    # On PRs, run when the `crash-capture` label is present OR the `changes`
    # job flags a crash-capture-relevant path. Push to main and manual
    # dispatch always run: the event_name clause on the first line
    # short-circuits before either label or `changes` output is consulted.
    # This only works because `changes` (above) runs unconditionally and
    # therefore always succeeds outside pull_request — a skipped `needs` job
    # would otherwise skip this job too via the implicit success() guard on
    # job-level `if:`.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'crash-capture') ||
      needs.changes.outputs.crash_capture == 'true'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Crashpad + mini_chromium nest extremely deep under FetchContent; the
      # default build-tree path blows past Windows MAX_PATH (260). Long-path
      # support is mandatory for the Crashpad checkout/build to succeed.
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.1'
          arch: 'win64_msvc2022_64'
          # Same Qt set as ci.yml. qtdeclarative + qtshadertools are not optional
          # extras here: exosnap IS the Qt Quick application (ADR 0064), so without
          # them find_package(Qt6) fails, app/CMakeLists.txt falls back to its
          # "exosnap skipped: Qt6 not found" stub, and this job builds everything
          # EXCEPT the binary it exists to check.
          archives: 'qtbase qtsvg qtdeclarative'
          # qtshadertools stopped being an archive of the base package in Qt 6.11 and is
          # a MODULE now. Left under `archives:` it installs nothing and says nothing,
          # and Qt6QuickConfig.cmake then fails the configure -- the same silent-skip
          # shape the archive comment above warns about.
          modules: 'qtshadertools'
          # aqtinstall 3.3.0, the newest release on PyPI, cannot install Qt 6.11 at all:
          # the Qt repository moved to per-architecture folders (.../qt6_6111/
          # qt6_6111_msvc2022_64/) and 3.3.0 still builds the pre-6.11 path, so it fails
          # looking for XML data that is not there. Pinned to the upstream commit that
          # handles the new layout; drop this line once an aqtinstall release includes it.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
          cache: true

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      # Cache the fetched + built sentry-native/Crashpad source tree so reruns do
      # not re-clone and re-build the whole dependency. Keyed on the pinned
      # sentry-native version embedded in VendorSentry.cmake; bump the version
      # there and the cache key rotates automatically.
      # Key (and restore-keys fallback) is scoped by generator ("ninja", hardcoded
      # to match the -G Ninja configure below): a cache saved under a differently-
      # generated build previously caused "CMake Error: generator : Ninja does not
      # match the generator used previously" on the FetchContent googletest
      # subbuild, whose own CMakeCache.txt lives under this same C:/es tree and
      # does not get regenerated just because the outer project reconfigures.
      - name: Cache FetchContent deps (sentry-native + Crashpad)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:/es
          key: es-fetchcontent-${{ runner.os }}-ninja-${{ hashFiles('cmake/VendorSentry.cmake') }}
          restore-keys: |
            es-fetchcontent-${{ runner.os }}-ninja-

      # Configure with a SHORT FetchContent base (C:/es) per VendorSentry.cmake's
      # MAX_PATH guidance. Ninja + sccache mirror the rest of CI. OFFICIAL_BUILD
      # stays OFF so no DSN / update key secret is needed.
      - name: Configure (crash capture ON)
        run: >-
          cmake -S . -B build/win-on -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEXOSNAP_USE_SCCACHE=ON
          -DEXOSNAP_ENABLE_CRASH_CAPTURE=ON
          -DEXOSNAP_OFFICIAL_BUILD=OFF
          -DFETCHCONTENT_BASE_DIR=C:/es

      - name: Build exosnap (crash capture ON)
        run: cmake --build build/win-on --target exosnap

      # Prove the out-of-process crash handler shipped next to the app binary —
      # the POST_BUILD stage in app/CMakeLists.txt copies it there. If it is
      # missing, the runtime crash handler would never launch.
      - name: Verify crashpad_handler.exe is staged
        shell: pwsh
        run: |
          # The app itself first. `--target exosnap` succeeds even when Qt6 was
          # not found, because that name then resolves to a stub whose whole
          # recipe is an echo -- so a missing crashpad_handler.exe used to be
          # reported as a staging failure when the real cause was that no
          # application had been built at all.
          $app = "build/win-on/app/exosnap.exe"
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            Write-Host "::error::exosnap.exe was not built at $app — the 'exosnap' target resolved to the Qt6-not-found stub, so nothing was staged next to it"
            exit 1
          }
          $exe = "build/win-on/app/crashpad_handler.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Host "::error::crashpad_handler.exe was not staged next to exosnap.exe at $exe"
            Get-ChildItem -LiteralPath "build/win-on/app" -Filter "*.exe" |
              ForEach-Object { Write-Host "  found: $($_.Name)" }
            exit 1
          }
          Write-Host "crashpad_handler.exe present: $((Get-Item $exe).Length) bytes"

      # Privacy review (ADR 0045, docs/privacy-review.md): build the test
      # targets and run the crash_capture suite against the REAL sentry-native
      # link (EXOSNAP_CRASH_CAPTURE_AVAILABLE=1). Previously this job only
      # built --target exosnap and never ran ctest at all, so the crash_capture
      # tests never exercised the real sentry-native API path. This does not
      # add a new sentry-specific test — it makes the EXISTING scrubber/engine
      # tests run under the ON configuration (docs/privacy-review.md documents
      # this as its own honest CI-reach boundary: the sentry-free golden-set
      # test in ci.yml's build-test job is what every PR gets; this ON-build
      # test run only happens here, gated to push-to-main / the crash-capture
      # label / manual dispatch, same as this whole job).
      - name: Build tests (crash capture ON)
        run: cmake --build build/win-on

      - name: Test crash_capture (crash capture ON)
        # "crash." matches every libs/crash_capture test binary's CTest entry
        # name (TEST_PREFIX "crash." in libs/crash_capture/CMakeLists.txt):
        # test_crash_scrubber, test_crash_capture_engine, test_local_minidump.
        run: >-
          pwsh -NonInteractive -File scripts/run-tests.ps1
          -BuildDir build/win-on -Config Release
          -Filter crash. -ExcludeLabel live

      - name: sccache stats
        if: always()
        run: sccache --show-stats
