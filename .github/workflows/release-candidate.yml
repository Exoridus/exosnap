name: Release Candidate

on:
  workflow_dispatch:
  # Run automatically on version tags -- both FINAL (vX.Y.Z, e.g. v0.9.0) and
  # RELEASE CANDIDATE (vX.Y.Z-<suffix>, e.g. v0.9.0-rc1) -- and release/** branches
  # so a missing-DLL or packaging regression is caught before the release ships.
  # Do NOT add pull_request here — the full VS Release build is too slow for PR CI.
  push:
    tags: ['v*']
    branches: ['release/**']

# This workflow produces the canonical release artifacts (portable ZIP + MSI)
# from a single Release build and install tree. It does NOT create any tag (a
# human always pushes it — that is what triggers this workflow), change
# repository visibility, or publish to WinGet.
#
# For an OFFICIAL release build it DOES own the GitHub Release deterministically:
# the `publish-release` job creates a DRAFT Release for the tag, uploads every asset
# plus the signed update manifest, re-downloads and re-hashes them, and only then
# un-drafts (publishes) the Release. If any validation fails the Release stays a
# hidden draft, so a release is never visible to users or the in-app updater until
# every check passed. See docs/release-checklist.md §4.
#
# There are TWO shapes of official release, both triggered by pushing a real tag
# (never created by this workflow — see the "Block version tags" repository ruleset
# note in resolve-identity below), differing only in whether the Release is marked
# as a GitHub prerelease:
#
#   1. FINAL: push vX.Y.Z (e.g. v0.9.0) → published as a normal (Stable) Release.
#   2. RELEASE CANDIDATE: push vX.Y.Z-<suffix> (e.g. v0.9.0-rc1) → published as a
#      GitHub PRERELEASE. The client-side channel logic
#      (libs/update/src/release_locator.cpp) filters on GitHub's real `prerelease`
#      flag, so an RC is only ever offered to users on the Preview channel; Stable
#      users never see it. This exists so the manual live checks in
#      docs/release-checklist.md §5/§6/§7 — in particular the end-to-end updater
#      round trip, which needs a REAL published release to download from — can be
#      run against real official artifacts BEFORE the final tag is pushed. Once the
#      RC passes, push `vX.Y.Z` from the same commit and it takes path 1.
#
# Both shapes run the identical build, validation, signing and publish steps; the
# `resolve-identity` job below is the single place that decides which tag is being
# released, whether the run is official, and whether it is a prerelease (purely
# from the pushed tag's own shape — no dispatch input involved).
#
# VERSION IDENTITY (ADR 0054). The tag is the sole source of the release version, and
# the FULL version — suffix included — is carried end to end: resolve-identity exports
# it, the configure step compiles it into the binaries via -DEXOSNAP_RELEASE_VERSION,
# a dedicated step reads it back out of the built executables and fails the job if it
# disagrees with the tag, the packaging script names the ZIP/MSI for it, and the signed
# update manifest announces it. So tag == embedded == package name == manifest, proven
# rather than assumed.
#
# The practical consequence, and it is intentional: pushing v0.9.0 after v0.9.0-rc4
# rebuilds the same commit rather than re-labelling the RC's binaries, because those
# bytes say "0.9.0-rc4" and the embedded-version check would reject them under the
# final tag. Same source, different artifacts — see ADR 0054 for why that trade is the
# right one.
#
# Fail-closed: an official release build (either shape) with the update key MISSING
# hard-fails the build job (see "Configure Release tree") rather than silently
# degrading to an unofficial artifact. Non-release builds (PRs via release/**
# branches, forks, a plain manual dispatch) keep building working UNOFFICIAL
# artifacts and publish nothing.

jobs:
  # Single source of truth for "what is this run releasing, and is it official?".
  # Every downstream job reads these outputs instead of re-deriving the answer from
  # github.ref / GITHUB_REF_TYPE.
  #
  # Outputs:
  #   release_tag  — the tag the GitHub Release lives under ('' = publish nothing)
  #   is_official  — 'true' when this run must be treated as an official release build
  #   prerelease   — 'true' when the Release must be marked as a GitHub prerelease (RC)
  #   full_version — the FULL release identity ('0.9.0-rc4'), tag with the leading 'v'
  #                  stripped and NOTHING else removed. This is the single value the
  #                  whole pipeline names artifacts, compiles into the binaries, and
  #                  writes into the signed update manifest from.
  #   base_version — the numeric X.Y.Z base ('0.9.0'), for the places that are
  #                  structurally incapable of carrying a prerelease suffix (Windows
  #                  VERSIONINFO's numeric fields, the MSI ProductVersion property).
  #
  # Deriving both HERE, once, is the point: before this job owned them, four separate
  # places re-parsed project(VERSION) out of CMakeLists.txt with four copies of the same
  # regex, and every one of them produced the BASE version — which is exactly how an RC
  # ended up publishing artifacts named, and binaries stamped, "0.9.0" (see ADR 0054).
  #
  # Runs on every trigger (it is seconds of work) so the branch/PR path keeps building
  # UNOFFICIAL artifacts exactly as before, just with release_tag = '' and the honest
  # '<base>-dev' identity the root CMakeLists.txt gives an unofficial build.
  resolve-identity:
    name: Resolve Release Identity
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.id.outputs.release_tag }}
      is_official: ${{ steps.id.outputs.is_official }}
      prerelease: ${{ steps.id.outputs.prerelease }}
      full_version: ${{ steps.id.outputs.full_version }}
      base_version: ${{ steps.id.outputs.base_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # An earlier version of this workflow could create a release-candidate tag
      # itself from a workflow_dispatch input (gh release create --target
      # $GITHUB_SHA). That broke on the first real RC dispatch: this repo's "Block
      # version tags" ruleset (refs/tags/v*, blocks creation/update/deletion) has no
      # bypass for the Actions token, only for certain repository roles held by a
      # human pushing over their own credentials — so un-drafting the Release (which
      # requires the tag to actually exist) failed with a 422 "creations being
      # restricted". Tags are therefore always human-pushed now, both final and RC;
      # this step only classifies whichever tag triggered the run, never creates one.
      #
      # Validated BEFORE the ~30-minute Release build so a malformed tag fails in
      # seconds rather than after a full build. Two guards, both fail-closed:
      #   (a) shape must be exactly vX.Y.Z (final) or vX.Y.Z-rcN (RC). The runtime
      #       gives ordered prerelease semantics specifically to rcN, so the release
      #       pipeline must not publish a broader label language than clients understand.
      #   (b) its X.Y.Z BASE must equal the version in CMakeLists.txt, so a tag can never
      #       claim a base version the source tree does not declare.
      # The tag is then the sole source of the FULL release identity: everything after
      # the leading 'v' — suffix INCLUDED — becomes full_version, which is what gets
      # compiled into the binaries, printed on the packages, and signed into the update
      # manifest. Only the base-equality COMPARISON strips the suffix; the exported
      # value never does.
      - name: Resolve release tag / official-ness
        id: id
        run: |
          set -euo pipefail
          release_tag=""
          prerelease="false"
          full_version=""

          # The base version is read once, here, and exported. project(VERSION) is the
          # only place in the repo that declares it.
          base_version=$(sed -nE 's/^[[:space:]]*project\([[:space:]]*exosnap[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)
          if [ -z "$base_version" ]; then
            echo "::error::Could not parse project(exosnap VERSION x.y.z) from CMakeLists.txt."
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              prerelease="false"
            elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$ ]]; then
              prerelease="true"
            else
              echo "::error::Tag '$GITHUB_REF_NAME' is not a valid release tag. Expected vX.Y.Z (final, e.g. v0.9.0) or vX.Y.Z-rcN with N >= 1 (release candidate, e.g. v0.9.0-rc4)."
              exit 1
            fi
            # Strip ONLY the leading 'v'. Any prerelease suffix is part of the identity.
            full_version="${GITHUB_REF_NAME#v}"
            tag_base="${full_version%%-*}"
            if [ "$tag_base" != "$base_version" ]; then
              echo "::error::Tag '$GITHUB_REF_NAME' targets base version $tag_base, but CMakeLists.txt declares $base_version. The artifacts this run builds would be named ExoSnap-$base_version-*, not matching the tag. Bump the version first (release-checklist §1) or fix the tag."
              exit 1
            fi
            # '-dev' is reserved by the root CMakeLists.txt as the marker for an
            # UNOFFICIAL developer build; a release tag must never claim it. CMake
            # would FATAL_ERROR on it anyway — catching it here fails in seconds
            # instead of after the Qt install and MSVC setup.
            if [ "$full_version" = "$base_version-dev" ]; then
              echo "::error::Tag '$GITHUB_REF_NAME' uses the reserved '-dev' prerelease label, which marks unofficial developer builds. Pick a real candidate label (e.g. v$base_version-rc1)."
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
          else
            # Not a release: this run must build (and name) an honest dev artifact, and
            # this value must match what the root CMakeLists.txt produces when it is
            # configured WITHOUT -DEXOSNAP_RELEASE_VERSION. Kept in sync with it.
            full_version="$base_version-dev"
          fi

          is_official=$([ -n "$release_tag" ] && echo true || echo false)
          {
            echo "release_tag=$release_tag"
            echo "is_official=$is_official"
            echo "prerelease=$prerelease"
            echo "full_version=$full_version"
            echo "base_version=$base_version"
          } >> "$GITHUB_OUTPUT"
          echo "release_tag='$release_tag' is_official=$is_official prerelease=$prerelease full_version=$full_version base_version=$base_version"

  build:
    name: Build Release Artifacts
    needs: resolve-identity
    runs-on: windows-2022
    # The version is NOT a build-job output: resolve-identity owns it, and every step
    # here (and every downstream job) reads it from there. Re-exporting it would just
    # recreate the duplicate-source problem ADR 0054 removed.
    outputs:
      portable_sha256: ${{ steps.shas.outputs.portable_sha256 }}
      msi_sha256: ${{ steps.shas.outputs.msi_sha256 }}
    env:
      FULL_VERSION: ${{ needs.resolve-identity.outputs.full_version }}
      BASE_VERSION: ${{ needs.resolve-identity.outputs.base_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Deterministic build timestamp. app/GenerateBuildInfo.cmake honours
      # SOURCE_DATE_EPOCH (the reproducible-builds convention) for the timestamp it
      # bakes into ExoSnapBuildInfo.h; pinning it to the COMMIT time means two builds
      # of the same commit produce the same embedded timestamp, so "did this artifact
      # come from that commit?" is answerable from the binary rather than from CI logs.
      # The cmake script would fall back to the same `git log -1 --format=%ct` on its
      # own, but stating it explicitly here makes the value visible in the run log and
      # keeps it identical across every step of the job.
      - name: Pin deterministic build timestamp (SOURCE_DATE_EPOCH)
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(git log -1 --format=%ct)
          if ! [[ "$epoch" =~ ^[0-9]+$ ]]; then
            echo "::error::git log -1 --format=%ct returned '$epoch', not a Unix timestamp."
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$epoch (commit $GITHUB_SHA)"

      # qtdeclarative + qtshadertools are MANDATORY for the shipped artifact: the
      # ExoSnap application (app/quick/ExoSnap/Quick, target `exosnap`) is a Qt
      # Quick program and links Qt6::Qml/Quick/QuickControls2/QuickDialogs2/
      # QuickTest, all shipped in the single qtdeclarative archive; qtshadertools
      # is a separate archive Qt6QuickConfig.cmake hard-requires to be installed
      # (qmlcachegen/shader compilation) even before this project's own
      # find_package(... COMPONENTS Quick) runs. Dropping either archive does not
      # produce a Widgets fallback — it produces no application at all.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.9.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtsvg qtdeclarative qtshadertools'
          cache: true

      # Pinned so the release pipeline can't silently pick up a new WiX major/minor
      # mid-cycle; verified working (4.0.5) as of this pin. Bump deliberately.
      #
      # No separate EULA-acceptance step: WiX v4's CLI (build/msi/burn/extension/
      # convert/format) has no `eula` command at all -- a leftover `wix eula accept
      # wix7` step here (presumably inherited from a WiX v3-era workflow) hard-failed
      # with WIX0118 ("Additional argument 'eula' was unexpected") the first time an
      # official-build CI run actually reached it, on the first real rc_tag dispatch.
      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 4.0.5
        shell: pwsh

      - name: Set up MSVC environment
        uses: ./.github/actions/setup-msvc

      # Crashpad + mini_chromium nest extremely deep under FetchContent; the
      # default build-tree path blows past Windows MAX_PATH (260). Long-path
      # support is mandatory for the official (crash-capture ON) build to succeed.
      - name: Enable git long paths
        run: git config --global core.longpaths true

      # Cache the fetched + built sentry-native/Crashpad tree (official build only)
      # so reruns do not re-clone and re-build the whole dependency. Keyed on the
      # pinned sentry-native version AND scoped to the Visual Studio generator.
      #
      # The cache MUST be generator-scoped: this job configures C:/es with the
      # "Visual Studio 17 2022" generator (preset windows-x64-release), while
      # crash-capture-build.yml configures the same C:/es path with `-G Ninja`.
      # A shared key let a Ninja-configured FetchContent subbuild (googletest)
      # leak into this VS configure, and CMake aborts with "generator: Visual
      # Studio 17 2022 does not match the generator used previously: Ninja".
      # The `-vs2022-` namespace keeps the two generators' caches from crossing.
      - name: Cache FetchContent deps (sentry-native + Crashpad)
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: C:/es
          key: es-fetchcontent-${{ runner.os }}-vs2022-${{ hashFiles('cmake/VendorSentry.cmake') }}
          restore-keys: |
            es-fetchcontent-${{ runner.os }}-vs2022-

      # Pre-configure the Release tree. The Release link always passes /DEBUG, so
      # the linker emits a separate exosnap.pdb the symbol-archiving step can
      # collect. The release script is then invoked with -SkipConfigure so it builds
      # + packages against this already-configured tree (its build dir is
      # build/windows-x64-release, matching this preset). The .pdb stays in the build
      # tree; the install/ZIP/MSI never ship it (install deploys RUNTIME only).
      #
      # Official build: when the EXOSNAP_UPDATE_PUBLIC_KEY_HEX repo VARIABLE is set,
      # this enables the full 0.4.0 feature set — crash capture (out-of-process
      # Crashpad + the Sentry Stage-1 DSN, gated on EXOSNAP_OFFICIAL_BUILD) and
      # runtime update checking (IsUpdateCheckEnabled() returns true only for
      # official builds). The embedded public key is required by the CMake gate and
      # used by the signed-manifest verification.
      #
      # FAIL-CLOSED on official release builds: pushing a final (vX.Y.Z) or RC
      # (vX.Y.Z-<suffix>) tag both produce artifacts real users install. If the update
      # key is missing on such a build we hard-fail rather than silently shipping an
      # UNOFFICIAL artifact (no crash key, updater disabled, no embedded verification
      # key) under a release tag — a v0.9.0 (or v0.9.0-rc1) tag must never produce an
      # artifact that lacks the update-verification key. An RC that shipped without it
      # could not be updater-tested at all, which is the entire point of cutting one.
      # Builds that release nothing (release/** test branches, forks, manual dispatch)
      # keep building a working UNOFFICIAL artifact so the fork/PR path is never broken.
      - name: Configure Release tree
        shell: pwsh
        env:
          PUBKEY: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
          RELEASE_TAG: ${{ needs.resolve-identity.outputs.release_tag }}
          IS_OFFICIAL: ${{ needs.resolve-identity.outputs.is_official }}
        run: |
          $cfgArgs = @('--preset', 'windows-x64-release')
          $isOfficialRelease = ($env:IS_OFFICIAL -eq 'true')
          # resolve-identity's is_official is the sole authority on whether this run
          # ships a release, so it is the sole authority on whether the build is
          # OFFICIAL, too -- not merely "the PUBKEY repo variable happens to be set",
          # which is a repo-wide value with no idea which ref triggered this run. The
          # previous check-PUBKEY-first order meant a plain release/** branch push
          # silently built with Crashpad + EXOSNAP_OFFICIAL_BUILD=ON in the main
          # repo (where PUBKEY is always present) even though resolve-identity called
          # that same run unofficial and every other gate (-FailOnInconclusive, PDB
          # hard-fail) treated it as such -- an inconsistent model, not a vulnerability
          # (release/** never publishes), but worth being exact about.
          if ($isOfficialRelease) {
            if (-not $env:PUBKEY) {
              Write-Error "::error::EXOSNAP_UPDATE_PUBLIC_KEY_HEX repo variable is not set, but this build is releasing under the tag '$($env:RELEASE_TAG)'. A release tag (final or RC) must produce an OFFICIAL artifact (crash capture + embedded update-verification key). Refusing to degrade to an UNOFFICIAL artifact for a release tag. Set the EXOSNAP_UPDATE_PUBLIC_KEY_HEX repository variable and the EXOSNAP_UPDATE_SIGNING_KEY secret, then re-tag (or re-dispatch)."
              exit 1
            }
            Write-Host "Official build: crash capture (Sentry DSN) + update checking ENABLED."
            Write-Host "Release identity compiled in: $($env:FULL_VERSION) (base $($env:BASE_VERSION))."
            # THE injection point for the release identity. Without it the root
            # CMakeLists.txt hard-fails an EXOSNAP_OFFICIAL_BUILD=ON configure (it
            # refuses to let an official build ship without declaring what it is), and
            # with it every downstream version form -- kVersion, the VERSIONINFO
            # ProductVersion string of exosnap.exe and exosnap-updater.exe -- is
            # derived from the tag rather than from project(VERSION). This is what
            # makes "the tag and the binary agree" a provable statement instead of a
            # convention; the "Verify embedded release version" step below proves it.
            $cfgArgs += @(
              '-DEXOSNAP_ENABLE_CRASH_CAPTURE=ON',
              '-DEXOSNAP_OFFICIAL_BUILD=ON',
              "-DEXOSNAP_RELEASE_VERSION=$($env:FULL_VERSION)",
              "-DEXOSNAP_UPDATE_PUBLIC_KEY_HEX=$($env:PUBKEY)",
              '-DFETCHCONTENT_BASE_DIR=C:/es'
            )
          } else {
            # EXOSNAP_RELEASE_VERSION is deliberately NOT passed: an unofficial build
            # must not be able to claim a release identity. CMake gives it
            # "<base>-dev", which is exactly what resolve-identity exported as
            # full_version for this path, so the packaging step's names and the
            # embedded ProductVersion still agree.
            Write-Host "::warning::Building UNOFFICIAL (no Sentry DSN, update checking disabled at runtime) -- this run releases nothing, regardless of whether EXOSNAP_UPDATE_PUBLIC_KEY_HEX happens to be set repo-wide. Identity: $($env:FULL_VERSION)."
          }
          cmake @cfgArgs

      # RELEASE GATE: runs build-release-artifacts.ps1 without -SkipSmoke or -SkipMsi.
      # This means the full validation pipeline runs:
      #   - cmake --install staging + presence/absence/leak/metadata audit
      #   - dumpbin /dependents runtime-dependency audit (no UNRESOLVED imports)
      #   - WiX harvest + wix build → MSI
      #   - MSI content assertion (msiexec /a extract + all staging binaries present)
      #   - MSI smoke (launch from extracted MSI; fail on STATUS_DLL_NOT_FOUND/dialog)
      #   - Portable ZIP smoke (launch from extracted ZIP; fail on hard errors)
      # A nonzero exit fails this job and blocks the release push.
      # -SkipConfigure is passed because cmake was configured in the step above;
      # the important gates (-SkipSmoke, -SkipMsi, -SkipBuild) are all OFF.
      # -FailOnInconclusive on an official release build (final tag OR RC tag):
      # an inconclusive smoke (MSI/portable/updater) must not silently pass the gate that
      # produces the artifacts an actual release ships. Non-official builds keep the
      # lenient default so a GPU-less fork/PR run doesn't spuriously fail on ambiguous
      # results.
      - name: Build and validate release artifacts (release gate)
        shell: pwsh
        env:
          PUBKEY: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
          IS_OFFICIAL: ${{ needs.resolve-identity.outputs.is_official }}
        run: |
          # HASHTABLE splat, not an array: `@('-FailOnInconclusive')` splatted as an
          # array does NOT re-parse as a named switch -- PowerShell only does
          # name-based binding for splatted HASHTABLES. An array splat here bound
          # the string "-FailOnInconclusive" positionally to $Preset (position 0)
          # instead, which broke $BuildDir ("build/-FailOnInconclusive") and failed
          # the very first real official-build CI run at the build step. Reproduced
          # and confirmed the fix locally before pushing.
          $extraArgs = @{}
          $isOfficialRelease = ($env:IS_OFFICIAL -eq 'true')
          if ($env:PUBKEY -and $isOfficialRelease) { $extraArgs['FailOnInconclusive'] = $true }
          # -ReleaseVersion is what the packages are NAMED for. The script cross-checks
          # it against the ProductVersion string embedded in the installed exosnap.exe
          # and exosnap-updater.exe BEFORE it writes the ZIP or the MSI, so passing a
          # value that disagrees with the configure above aborts packaging rather than
          # producing a mislabelled artifact.
          & scripts/build-release-artifacts.ps1 -SkipConfigure -ReleaseVersion $env:FULL_VERSION @extraArgs
          exit $LASTEXITCODE

      # THE tag-to-binary proof, and the reason a released RC can never be silently
      # re-labelled as its final.
      #
      # The step above proves the PACKAGE matches the BINARIES (the script compares the
      # name it was given against the embedded ProductVersion). This step closes the
      # remaining link: that the binaries match the TAG. It reads the ProductVersion
      # string straight out of the built executables and compares it to the value
      # resolve-identity derived from the pushed git tag — a path that never touches
      # the packaging script, so a bug in that script's own version handling cannot
      # make this check pass.
      #
      # Why the ProductVersion STRING and not the numeric FileVersion: Windows
      # VERSIONINFO's numeric fields cannot express a prerelease suffix, so a 0.9.0-rc4
      # build and a 0.9.0 build are numerically identical there (both 0.9.0.0). The
      # string field is the only place the distinction survives into the binary, which
      # is precisely why it is the field the release identity lives in.
      #
      # Practical consequence: taking the RC4 binaries and re-publishing them under the
      # final v0.9.0 tag is not possible without this step failing, because those bytes
      # still say "0.9.0-rc4". A final release must be its own build of the same commit.
      - name: Verify embedded release version matches the tag
        shell: pwsh
        run: |
          $expected = $env:FULL_VERSION
          $buildDir = 'build/windows-x64-release'
          # Exact target output locations, not a recursive search: a recursive match
          # could silently pick up some other exosnap.exe in the tree and "prove" the
          # version of a binary that is not the one being shipped. The VS generator
          # (this preset) writes to the Release/ subdir; the single-config layout is
          # listed too so the check survives a preset change. apps/updater is built
          # because add_dependencies(exosnap exosnap_updater) pulls it in.
          $exeCandidates = [ordered]@{
            'exosnap.exe'         = @("$buildDir/app/Release/exosnap.exe", "$buildDir/app/exosnap.exe")
            'exosnap-updater.exe' = @("$buildDir/apps/updater/Release/exosnap-updater.exe", "$buildDir/apps/updater/exosnap-updater.exe")
          }
          $failed = $false
          foreach ($exeName in $exeCandidates.Keys) {
            $exe = $exeCandidates[$exeName] | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if (-not $exe) {
              Write-Host "::error::$exeName was not found at any of: $($exeCandidates[$exeName] -join ', '). Cannot prove the release identity of an artifact that does not exist."
              $failed = $true
              continue
            }
            $actual = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
            if ($actual -ne $expected) {
              Write-Host "::error::$exeName carries ProductVersion '$actual' but this run releases '$expected' (from tag '$($env:RELEASE_TAG)'). The tag and the binary disagree, so the artifact would misrepresent which release it is. Never re-tag an existing build: a release of '$expected' must be built with -DEXOSNAP_RELEASE_VERSION=$expected."
              $failed = $true
            } else {
              Write-Host "  OK  $exeName ProductVersion = $actual  ($exe)"
            }
          }
          if ($failed) { exit 1 }
          Write-Host "Embedded release identity proven: tag '$($env:RELEASE_TAG)' == ProductVersion '$expected' in both shipped executables."
        env:
          RELEASE_TAG: ${{ needs.resolve-identity.outputs.release_tag }}

      # Archive the Release PDBs for offline symbolication of crash minidumps
      # (ADR 0017 § Symbol pipeline). Keyed by version + run id so a given build's
      # symbols are uniquely retrievable. This is the local/offline path; it does
      # NOT push symbols to a crash service.
      #
      # TODO(Crash-C): once a Sentry auth token is provisioned, add a step that
      # runs `sentry-cli debug-files upload --org <org> --project exosnap <pdbs>`
      # (and the matching crashpad_handler.pdb) so uploaded minidumps symbolicate
      # server-side. Deferred per ADR 0017 — needs a CI secret (auth token).
      - name: Collect Release PDBs
        id: pdbs
        env:
          PUBKEY: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
          IS_OFFICIAL: ${{ needs.resolve-identity.outputs.is_official }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "exosnap-pdbs"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $found = Get-ChildItem -Path build/windows-x64-release -Recurse -Filter *.pdb -File -ErrorAction SilentlyContinue
          foreach ($p in $found) { Copy-Item -LiteralPath $p.FullName -Destination $stage -Force }
          $count = (Get-ChildItem -Path $stage -Filter *.pdb -File).Count
          Write-Host "Collected $count PDB file(s) into $stage"
          # An official release build (final tag or RC) ships with crash capture (Crashpad)
          # ON — see "Configure Release tree" above — so its uploaded minidumps are only
          # ever symbolicatable if PDBs were actually archived here. A missing PDB set for
          # such a build silently ships crash reporting nobody can act on; fail-closed
          # rather than warn-and-continue. An RC is held to the same bar: a crash found
          # during the manual RC live checks is exactly the crash worth symbolicating.
          # Non-official builds (fork/PR/branch, no key) never enable crash capture, so a
          # missing PDB there is genuinely harmless.
          $isOfficial = [bool]$env:PUBKEY -and ($env:IS_OFFICIAL -eq 'true')
          if ($count -eq 0) {
            if ($isOfficial) {
              Write-Host "::error::No PDB files were found in the Release build tree for an OFFICIAL release build. Crashpad is enabled, so uploaded minidumps from this release could never be symbolicated. Failing the build."
              exit 1
            }
            Write-Host "::warning::No PDB files were found in the Release build tree. Symbol archiving will be empty. (Not an official release build, so this is non-fatal.)"
          }
          "dir=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      - name: Upload Release PDBs (symbol archive)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ExoSnap-${{ needs.resolve-identity.outputs.full_version }}-windows-x64-pdb-${{ github.run_id }}
          path: ${{ steps.pdbs.outputs.dir }}/*.pdb
          if-no-files-found: warn

      # Only the output directory is resolved here; the version comes from
      # resolve-identity. build-release-artifacts.ps1 keys its output directory on the
      # FULL version for exactly the reason ADR 0054 exists: an RC and the final build
      # of the same commit are different artifacts and must not share a staging tree.
      - name: Resolve artifact paths
        id: artifact
        run: |
          "dir=.workspace/release/$($env:FULL_VERSION)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      # Archives the exact toolchain that produced this release's artifacts —
      # runner image, MSVC/cl.exe, CMake, Qt, WiX, and the pinned FFmpeg
      # prebuilt — as its own release asset. This is purely informational (it
      # does not gate anything and carries no signature), so it is additive:
      # dropped into the same staging dir as artifact-manifest.json and picked
      # up by the existing "Upload all release artifacts" / publish-release
      # upload steps below rather than any new upload/verify path.
      - name: Generate toolchain manifest
        id: toolchain
        shell: pwsh
        run: |
          $dir = "${{ steps.artifact.outputs.dir }}"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          $qtVersion = ''
          if ($env:QT_ROOT_DIR -and ($env:QT_ROOT_DIR -match '[\\/](\d+\.\d+\.\d+)[\\/]')) {
            $qtVersion = $Matches[1]
          }

          # cl.exe writes its version banner to stderr and a usage line to stdout;
          # merging both streams with `2>&1` and taking the first line is a race
          # between them (observed picking the usage line in a fraction of runs).
          # Collect everything first, then pick the line that actually looks like
          # a version banner.
          $clVersionLine = ((cl 2>&1) | Out-String) -split "`r?`n" |
                            Where-Object { $_ -match 'Version \d+\.\d+' } | Select-Object -First 1
          $clVersionLine = if ($clVersionLine) { $clVersionLine.Trim() } else { '' }
          $cmakeVersionLine = (cmake --version | Select-Object -First 1).Trim()
          $wixVersionLine = (wix --version).Trim()

          $vendorFfmpeg = Get-Content -LiteralPath 'cmake/VendorFFmpeg.cmake' -Raw
          $ffmpegUrl = [regex]::Match($vendorFfmpeg, 'URL\s+"([^"]+)"').Groups[1].Value
          $ffmpegSha256 = [regex]::Match($vendorFfmpeg, 'URL_HASH\s+"SHA256=([0-9A-Fa-f]+)"').Groups[1].Value.ToLowerInvariant()

          $manifest = [ordered]@{
            product     = 'ExoSnap'
            version     = '${{ needs.resolve-identity.outputs.full_version }}'
            sourceCommit = (& git rev-parse HEAD).Trim()
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
            runner = [ordered]@{
              imageLabel   = 'windows-2022'
              imageOs      = $env:ImageOS
              imageVersion = $env:ImageVersion
            }
            msvc = [ordered]@{
              clVersion = $clVersionLine
            }
            cmake = [ordered]@{
              version = $cmakeVersionLine
            }
            qt = [ordered]@{
              version = $qtVersion
              rootDir = $env:QT_ROOT_DIR
            }
            wix = [ordered]@{
              version = $wixVersionLine
            }
            ffmpeg = [ordered]@{
              url    = $ffmpegUrl
              sha256 = $ffmpegSha256
            }
          }
          $manifestPath = Join-Path $dir 'toolchain-manifest.json'
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          Write-Host "Wrote toolchain manifest to $manifestPath"
          Get-Content -LiteralPath $manifestPath | Write-Host

      # Expose the portable + MSI SHA-256 hashes as job outputs so the
      # sign-manifest job can bind them into the signed update-manifest.json.
      # The sidecars are written by build-release-artifacts.ps1 as
      # "<hash>  <filename>"; take the first whitespace-delimited token.
      - name: Read artifact SHA-256 hashes
        id: shas
        run: |
          $dir = "${{ steps.artifact.outputs.dir }}"
          $ver = "${{ needs.resolve-identity.outputs.full_version }}"
          $portableSha = (Get-Content -LiteralPath (Join-Path $dir "ExoSnap-$ver-windows-x64-portable.sha256") -Raw).Trim().Split(' ')[0]
          $msiShaFile = Join-Path $dir "ExoSnap-$ver-windows-x64.msi.sha256"
          $msiSha = if (Test-Path -LiteralPath $msiShaFile) { (Get-Content -LiteralPath $msiShaFile -Raw).Trim().Split(' ')[0] } else { '' }
          "portable_sha256=$portableSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_sha256=$msiSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "portable_sha256=$portableSha"
          Write-Host "msi_sha256=$msiSha"
        shell: pwsh

      - name: Upload all release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ExoSnap-${{ needs.resolve-identity.outputs.full_version }}-windows-x64
          path: |
            ${{ steps.artifact.outputs.dir }}/ExoSnap-${{ needs.resolve-identity.outputs.full_version }}-windows-x64-portable.zip
            ${{ steps.artifact.outputs.dir }}/ExoSnap-${{ needs.resolve-identity.outputs.full_version }}-windows-x64-portable.sha256
            ${{ steps.artifact.outputs.dir }}/ExoSnap-${{ needs.resolve-identity.outputs.full_version }}-windows-x64.msi
            ${{ steps.artifact.outputs.dir }}/ExoSnap-${{ needs.resolve-identity.outputs.full_version }}-windows-x64.msi.sha256
            ${{ steps.artifact.outputs.dir }}/artifact-manifest.json
            ${{ steps.artifact.outputs.dir }}/validation-report.md
            ${{ steps.artifact.outputs.dir }}/toolchain-manifest.json
          if-no-files-found: error

  # Sign the update manifest for the in-app updater. MANDATORY for every official
  # release from 0.9.0 on: the 0.9+ update checker only surfaces a release that
  # carries an update-manifest.json asset — a release published without it is
  # invisible to in-app updates forever. Runs on every official release build — a
  # final or RC version-tag push — when the signing key is provisioned
  # (EXOSNAP_UPDATE_PUBLIC_KEY_HEX repo variable present = official build). Forks
  # without the key skip it rather than hard-failing. The asset URLs are the canonical
  # GitHub Release download paths for the RESOLVED release tag: for an RC that is the
  # RC's own prerelease, never the eventual final tag, so the manifest the updater
  # downloads during the RC live check points at assets that actually exist.
  #
  # This job generates + signs the manifest and verifies (a) the signing key really
  # is the private half of the embedded public key and (b) the detached signature
  # verifies, then publishes update-manifest.json + .sig as a build ARTIFACT. It does
  # NOT attach them to the GitHub Release here (attach_to_release: false) — the
  # downstream publish-release job owns the Release creation + upload so the ordering
  # is deterministic (create draft → upload → re-hash → publish) instead of racing a
  # Release that may not exist yet.
  #
  # `version` is the FULL release identity, and that is load-bearing rather than
  # cosmetic. It becomes both the manifest's `version` and its
  # `minimum_accepted_version`, which the client compares by SemVer precedence: with
  # the base version there, 0.9.0-rc4's manifest announced plain "0.9.0", so a client
  # already on 0.9.0-rc4 saw no newer version and could never discover 0.9.0-rc5 —
  # RC-to-RC updating, the one thing an RC exists to exercise, was untestable
  # (ADR 0054). It also makes the manifest agree with what the binaries report about
  # themselves, which the "Verify embedded release version" step above has proven.
  sign-manifest:
    name: Sign Update Manifest
    needs: [resolve-identity, build]
    if: ${{ needs.resolve-identity.outputs.is_official == 'true' && vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX != '' }}
    # Matches the write declared inside sign-manifest.yml (its standalone path uploads
    # to a Release). In this called path attach_to_release is false, so the write is
    # declared for consistency but not exercised — publish-release owns the upload.
    permissions:
      contents: write
    uses: ./.github/workflows/sign-manifest.yml
    with:
      version: ${{ needs.resolve-identity.outputs.full_version }}
      installer_sha256: ${{ needs.build.outputs.msi_sha256 }}
      portable_sha256: ${{ needs.build.outputs.portable_sha256 }}
      installer_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.resolve-identity.outputs.release_tag }}/ExoSnap-${{ needs.resolve-identity.outputs.full_version }}-windows-x64.msi
      portable_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.resolve-identity.outputs.release_tag }}/ExoSnap-${{ needs.resolve-identity.outputs.full_version }}-windows-x64-portable.zip
      attach_to_release: false
      # Unused while attach_to_release is false (publish-release owns the upload), but
      # passed so the called workflow never has to guess the tag — resolve-identity's
      # release_tag is always right, including for an RC tag where "v<version>" would
      # wrongly name the eventual final release instead.
      release_tag: ${{ needs.resolve-identity.outputs.release_tag }}
    secrets: inherit

  # Deterministic release publication (official release builds only — a final or RC
  # version-tag push; identical steps for both, the RC just lands on its own tag and
  # is marked as a GitHub prerelease). Fixes the
  # release/signing race: nothing used to create the GitHub Release, yet sign-manifest
  # assumed it existed and tried to `gh release upload` into it. Order here is:
  #   1. (done by `build`) build + validate artifacts
  #   2. create a DRAFT Release for this exact tag (idempotent; reuses one if present)
  #   3. (done by `sign-manifest`) generate manifest from the artifact SHA-256s, sign,
  #      verify the keypair + signature against the embedded public key
  #   4. upload every asset (ZIP, MSI, sidecars, manifest, .sig) to the draft
  #   5. re-download the published assets and re-hash them; cross-check the manifest's
  #      embedded SHA-256s against the shipped bytes and re-verify the signature
  #   6. only then un-draft (publish) the Release, marked as a prerelease on the RC path
  # If any check fails the Release stays a hidden draft — fail-closed. The RC path runs
  # every one of these steps, re-hash and signature re-verification included: an RC whose
  # assets were never re-verified would make the live updater test prove nothing.
  publish-release:
    name: Publish GitHub Release
    needs: [resolve-identity, build, sign-manifest]
    if: ${{ needs.resolve-identity.outputs.is_official == 'true' && vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve-identity.outputs.release_tag }}
      PRERELEASE: ${{ needs.resolve-identity.outputs.prerelease }}
      VERSION: ${{ needs.resolve-identity.outputs.full_version }}
      EXPECTED_PORTABLE_SHA: ${{ needs.build.outputs.portable_sha256 }}
      EXPECTED_MSI_SHA: ${{ needs.build.outputs.msi_sha256 }}
    steps:
      - name: Download release artifacts (ZIP + MSI + sidecars)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ExoSnap-${{ needs.resolve-identity.outputs.full_version }}-windows-x64
          path: release-assets

      - name: Download signed manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: update-manifest
          path: release-assets

      # Create the Release as a DRAFT so it (and its asset URLs) are invisible to
      # the in-app updater until every check below passes. Idempotent: if a human
      # (or an earlier, still-draft run of this same job) pre-created the Release,
      # reuse it rather than erroring. But `gh release view` only proves the Release
      # EXISTS, not that it is still a draft — a workflow rerun (or a second
      # workflow_dispatch) against a tag whose Release was already published by a
      # prior successful run would otherwise fall through to the upload step below
      # and `--clobber` live, publicly-visible assets before they are re-verified,
      # breaking the "never half-published" guarantee this job exists to provide.
      # Hard-fail instead: a published Release for this tag is a completed run: there
      # is nothing left for this job to safely do.
      #
      # The tag (final or RC) always already exists here — a human pushed it, which is
      # what triggered this run (see the ruleset note on resolve-identity above: this
      # workflow cannot create tags itself). `--target "$GITHUB_SHA"` is a no-op safety
      # net GitHub ignores whenever the tag already exists; kept only so this command
      # stays correct if that ever changes.
      - name: Create draft GitHub Release (if absent)
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            kind_args=(--prerelease)
            # $VERSION is the full identity now, so it already reads "0.9.0-rc4" and
            # repeating the tag after it would be redundant.
            title="ExoSnap $VERSION"
            notes="Release CANDIDATE for ExoSnap $VERSION, built from ${GITHUB_SHA}. Marked as a prerelease, so only the Preview update channel offers it; Stable users are unaffected. The artifacts carry $VERSION as their compiled-in ProductVersion — CI proved that against this tag before publishing — so this candidate is a distinct version to the updater and can be updated FROM, not just to. Artifacts and the signed update manifest are attached and verified by CI. This exists to run the manual live checks in docs/release-checklist.md §5/§6/§7 (including the end-to-end updater round trip) against real official artifacts before the final tag is pushed. Not a shipped release — do not announce."
          else
            kind_args=()
            title="ExoSnap $VERSION"
            notes="Automated release build for $TAG. Artifacts and the signed update manifest are attached and verified by CI. Review release notes, then this draft is published automatically once all checks pass. See docs/release-checklist.md before announcing."
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.draft')
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG already exists and is already published (not a draft). Refusing to re-upload/overwrite a live release's assets. If this tag genuinely needs to be re-released, delete the existing Release first (a deliberate, manual, human decision) and re-run. For an RC, cutting the next candidate (v0.9.0-rc2) is usually the better answer."
              exit 1
            fi
            # A stale draft is a real trap: if a first attempt tagged commit A, then
            # failed, and the code moved on to commit B before this run, reusing that
            # draft would upload B's artifacts under a tag that (for an already-existing
            # tag) still points at A -- a mismatch between what got tested and what the
            # tag says was released. Verify the tag's target commit matches this run's
            # before touching the draft at all.
            tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Release $TAG's tag already exists and points at commit $tag_commit, but this run built commit $GITHUB_SHA. Refusing to upload this run's artifacts into that draft -- they would not match the tag. For an RC, push the next candidate tag (e.g. v0.9.0-rc2) instead. For a final tag, delete and re-push the tag from the intended commit first (a deliberate, manual decision)."
              exit 1
            fi
            echo "Release $TAG already exists as a draft at the expected commit; uploading into it."
          else
            echo "Creating draft release $TAG (prerelease=$PRERELEASE) at $GITHUB_SHA."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --target "$GITHUB_SHA" \
              "${kind_args[@]}" \
              --title "$title" \
              --notes "$notes"
          fi

      - name: Upload all assets to the release
        working-directory: release-assets
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "ExoSnap-$VERSION-windows-x64-portable.zip" \
            "ExoSnap-$VERSION-windows-x64-portable.sha256" \
            "ExoSnap-$VERSION-windows-x64.msi" \
            "ExoSnap-$VERSION-windows-x64.msi.sha256" \
            update-manifest.json update-manifest.json.sig \
            toolchain-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Re-download the assets straight from the Release and re-hash them, so what a
      # user would actually fetch is proven byte-identical to what the gate built and
      # to what the signed manifest claims.
      - name: Re-download and verify published assets
        env:
          PUBKEY_HEX: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify --clobber \
            --pattern "ExoSnap-$VERSION-windows-x64-portable.zip" \
            --pattern "ExoSnap-$VERSION-windows-x64.msi" \
            --pattern "update-manifest.json" \
            --pattern "update-manifest.json.sig"
          portable_actual=$(sha256sum "verify/ExoSnap-$VERSION-windows-x64-portable.zip" | cut -d' ' -f1)
          msi_actual=$(sha256sum "verify/ExoSnap-$VERSION-windows-x64.msi" | cut -d' ' -f1)
          echo "portable expected=$EXPECTED_PORTABLE_SHA actual=$portable_actual"
          echo "msi      expected=$EXPECTED_MSI_SHA actual=$msi_actual"
          if [ "${portable_actual,,}" != "${EXPECTED_PORTABLE_SHA,,}" ]; then
            echo "::error::Portable ZIP SHA-256 changed between the build gate and the published Release asset."; exit 1
          fi
          if [ -n "$EXPECTED_MSI_SHA" ] && [ "${msi_actual,,}" != "${EXPECTED_MSI_SHA,,}" ]; then
            echo "::error::MSI SHA-256 changed between the build gate and the published Release asset."; exit 1
          fi
          pip install --quiet pynacl==1.6.2
          python3 - <<'PY'
          import json, hashlib, os, sys
          import nacl.signing
          v = os.environ["VERSION"]
          m = json.load(open("verify/update-manifest.json"))
          errs = []
          # The published manifest must announce the same full release identity the tag
          # resolved to and the binaries carry. Checked against what was actually
          # DOWNLOADED from the Release, so it also catches a stale manifest left behind
          # by an earlier attempt on this tag.
          for field in ("version", "minimum_accepted_version"):
              if m.get(field) != v:
                  errs.append(f"published manifest {field}='{m.get(field)}' != release version '{v}'")
          def sha(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for b in iter(lambda: f.read(1 << 20), b""):
                      h.update(b)
              return h.hexdigest()
          files = {
              "installer": f"verify/ExoSnap-{v}-windows-x64.msi",
              "portable":  f"verify/ExoSnap-{v}-windows-x64-portable.zip",
          }
          for pkg in m["packages"]:
              kind = pkg["kind"]; want = pkg["sha256"].lower()
              path = files.get(kind)
              if not path or not os.path.exists(path):
                  errs.append(f"manifest lists package '{kind}' but its asset is missing"); continue
              got = sha(path)
              if got != want:
                  errs.append(f"{kind}: manifest sha256={want} != shipped asset sha256={got}")
          if errs:
              print("::error::" + "; ".join(errs)); sys.exit(1)
          data = open("verify/update-manifest.json", "rb").read()
          sig = bytes.fromhex(open("verify/update-manifest.json.sig").read().strip())
          nacl.signing.VerifyKey(bytes.fromhex(os.environ["PUBKEY_HEX"])).verify(data, sig)
          print("Published assets match the build gate and the signed manifest; signature verifies against the embedded public key.")
          PY

      # --prerelease is set explicitly (not just at creation) so the published state is
      # deterministic even when this run re-used a draft created by an earlier attempt:
      # the Stable-vs-Preview split the client makes (libs/update/src/release_locator.cpp)
      # keys off exactly this flag, so an RC that lost it would be offered to every Stable
      # user, and a final release that gained it would be invisible to them.
      #
      # Both places that set the flag (the `gh release create` above and this
      # `gh release edit`) read the same $PRERELEASE job env, which is
      # resolve-identity's `prerelease` output and nothing else — derived purely from
      # the pushed tag's shape. There is no second opinion to drift out of sync with.
      - name: Publish (un-draft) the release
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE"
          if [ "$PRERELEASE" = "true" ]; then
            echo "Published PRERELEASE $TAG (Preview channel only)."
          else
            echo "Published release $TAG."
          fi
