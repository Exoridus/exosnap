name: Release Candidate

on:
  workflow_dispatch:
  # Run automatically on version tags (e.g. v0.5.0) and release/** branches so
  # a missing-DLL or packaging regression is caught before the release ships.
  # Do NOT add pull_request here — the full VS Release build is too slow for PR CI.
  push:
    tags: ['v*']
    branches: ['release/**']

# This workflow produces the canonical release artifacts (portable ZIP + MSI)
# from a single Release build and install tree. It does NOT create the git tag
# (the human pushes that — it is what triggers this workflow), change repository
# visibility, or publish to WinGet.
#
# For an OFFICIAL version-tag build (a `v*` tag with the signing key provisioned)
# it now DOES own the GitHub Release deterministically: the `publish-release` job
# creates a DRAFT Release for the tag, uploads every asset plus the signed update
# manifest, re-downloads and re-hashes them, and only then un-drafts (publishes)
# the Release. If any validation fails the Release stays a hidden draft, so a
# release is never visible to users or the in-app updater until every check
# passed. See docs/release-checklist.md §3.
#
# Fail-closed: an official version-tag build with the update key MISSING hard-fails
# the build job (see "Configure Release tree") rather than silently degrading to an
# unofficial artifact. Non-tag builds (PRs via release/** branches, forks) keep
# building working UNOFFICIAL artifacts.

jobs:
  build:
    name: Build Release Artifacts
    runs-on: windows-2022
    outputs:
      version: ${{ steps.artifact.outputs.version }}
      portable_sha256: ${{ steps.shas.outputs.portable_sha256 }}
      msi_sha256: ${{ steps.shas.outputs.msi_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtsvg'
          cache: true

      # Pinned so the release pipeline can't silently pick up a new WiX major/minor
      # mid-cycle; verified working (4.0.5) as of this pin. Bump deliberately.
      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 4.0.5
        shell: pwsh

      - name: Accept WiX EULA
        run: wix eula accept wix7
        shell: pwsh

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Crashpad + mini_chromium nest extremely deep under FetchContent; the
      # default build-tree path blows past Windows MAX_PATH (260). Long-path
      # support is mandatory for the official (crash-capture ON) build to succeed.
      - name: Enable git long paths
        run: git config --global core.longpaths true

      # Cache the fetched + built sentry-native/Crashpad tree (official build only)
      # so reruns do not re-clone and re-build the whole dependency. Keyed on the
      # pinned sentry-native version AND scoped to the Visual Studio generator.
      #
      # The cache MUST be generator-scoped: this job configures C:/es with the
      # "Visual Studio 17 2022" generator (preset windows-x64-release), while
      # crash-capture-build.yml configures the same C:/es path with `-G Ninja`.
      # A shared key let a Ninja-configured FetchContent subbuild (googletest)
      # leak into this VS configure, and CMake aborts with "generator: Visual
      # Studio 17 2022 does not match the generator used previously: Ninja".
      # The `-vs2022-` namespace keeps the two generators' caches from crossing.
      - name: Cache FetchContent deps (sentry-native + Crashpad)
        uses: actions/cache@v4
        with:
          path: C:/es
          key: es-fetchcontent-${{ runner.os }}-vs2022-${{ hashFiles('cmake/VendorSentry.cmake') }}
          restore-keys: |
            es-fetchcontent-${{ runner.os }}-vs2022-

      # Pre-configure the Release tree. The Release link always passes /DEBUG, so
      # the linker emits a separate exosnap.pdb the symbol-archiving step can
      # collect. The release script is then invoked with -SkipConfigure so it builds
      # + packages against this already-configured tree (its build dir is
      # build/windows-x64-release, matching this preset). The .pdb stays in the build
      # tree; the install/ZIP/MSI never ship it (install deploys RUNTIME only).
      #
      # Official build: when the EXOSNAP_UPDATE_PUBLIC_KEY_HEX repo VARIABLE is set,
      # this enables the full 0.4.0 feature set — crash capture (out-of-process
      # Crashpad + the Sentry Stage-1 DSN, gated on EXOSNAP_OFFICIAL_BUILD) and
      # runtime update checking (IsUpdateCheckEnabled() returns true only for
      # official builds). The embedded public key is required by the CMake gate and
      # used by the signed-manifest verification.
      #
      # FAIL-CLOSED on version tags: a `v*` tag is a real release. If the update key
      # is missing on such a build we hard-fail rather than silently shipping an
      # UNOFFICIAL artifact (no crash key, updater disabled, no embedded verification
      # key) under a version-tag name — a v0.9.0 tag must never produce an artifact
      # that lacks the update-verification key. Builds that are NOT a version tag
      # (release/** test branches, forks, manual dispatch on a branch) keep building
      # a working UNOFFICIAL artifact so the fork/PR path is never broken.
      - name: Configure Release tree
        shell: pwsh
        env:
          PUBKEY: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
        run: |
          $cfgArgs = @('--preset', 'windows-x64-release')
          $isVersionTag = ($env:GITHUB_REF_TYPE -eq 'tag') -and ($env:GITHUB_REF_NAME -like 'v*')
          if ($env:PUBKEY) {
            Write-Host "Official build: crash capture (Sentry DSN) + update checking ENABLED."
            $cfgArgs += @(
              '-DEXOSNAP_ENABLE_CRASH_CAPTURE=ON',
              '-DEXOSNAP_OFFICIAL_BUILD=ON',
              "-DEXOSNAP_UPDATE_PUBLIC_KEY_HEX=$($env:PUBKEY)",
              '-DFETCHCONTENT_BASE_DIR=C:/es'
            )
          } elseif ($isVersionTag) {
            Write-Error "::error::EXOSNAP_UPDATE_PUBLIC_KEY_HEX repo variable is not set, but this build was triggered by the version tag '$($env:GITHUB_REF_NAME)'. A v* tag must produce an OFFICIAL artifact (crash capture + embedded update-verification key). Refusing to degrade to an UNOFFICIAL artifact for a release tag. Set the EXOSNAP_UPDATE_PUBLIC_KEY_HEX repository variable and the EXOSNAP_UPDATE_SIGNING_KEY secret, then re-tag."
            exit 1
          } else {
            Write-Host "::warning::EXOSNAP_UPDATE_PUBLIC_KEY_HEX repo variable not set — building UNOFFICIAL (no Sentry DSN, update checking disabled at runtime). Allowed because this is not a version-tag build."
          }
          cmake @cfgArgs

      # RELEASE GATE: runs build-release-artifacts.ps1 without -SkipSmoke or -SkipMsi.
      # This means the full validation pipeline runs:
      #   - cmake --install staging + presence/absence/leak/metadata audit
      #   - dumpbin /dependents runtime-dependency audit (no UNRESOLVED imports)
      #   - WiX harvest + wix build → MSI
      #   - MSI content assertion (msiexec /a extract + all staging binaries present)
      #   - MSI smoke (launch from extracted MSI; fail on STATUS_DLL_NOT_FOUND/dialog)
      #   - Portable ZIP smoke (launch from extracted ZIP; fail on hard errors)
      # A nonzero exit fails this job and blocks the release push.
      # -SkipConfigure is passed because cmake was configured in the step above;
      # the important gates (-SkipSmoke, -SkipMsi, -SkipBuild) are all OFF.
      # -FailOnInconclusive on an official version-tag build: an inconclusive smoke
      # (MSI/portable/updater) must not silently pass the gate that produces the
      # artifacts an actual release ships. Non-official builds keep the lenient
      # default so a GPU-less fork/PR run doesn't spuriously fail on ambiguous results.
      - name: Build and validate release artifacts (release gate)
        shell: pwsh
        env:
          PUBKEY: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
        run: |
          $extraArgs = @()
          $isVersionTag = ($env:GITHUB_REF_TYPE -eq 'tag') -and ($env:GITHUB_REF_NAME -like 'v*')
          if ($env:PUBKEY -and $isVersionTag) { $extraArgs += '-FailOnInconclusive' }
          & scripts/build-release-artifacts.ps1 -SkipConfigure @extraArgs
          exit $LASTEXITCODE
        shell: pwsh

      # Archive the Release PDBs for offline symbolication of crash minidumps
      # (ADR 0017 § Symbol pipeline). Keyed by version + run id so a given build's
      # symbols are uniquely retrievable. This is the local/offline path; it does
      # NOT push symbols to a crash service.
      #
      # TODO(Crash-C): once a Sentry auth token is provisioned, add a step that
      # runs `sentry-cli debug-files upload --org <org> --project exosnap <pdbs>`
      # (and the matching crashpad_handler.pdb) so uploaded minidumps symbolicate
      # server-side. Deferred per ADR 0017 — needs a CI secret (auth token).
      - name: Collect Release PDBs
        id: pdbs
        env:
          PUBKEY: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(\s*exosnap\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $stage = Join-Path $env:RUNNER_TEMP "exosnap-pdbs"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $found = Get-ChildItem -Path build/windows-x64-release -Recurse -Filter *.pdb -File -ErrorAction SilentlyContinue
          foreach ($p in $found) { Copy-Item -LiteralPath $p.FullName -Destination $stage -Force }
          $count = (Get-ChildItem -Path $stage -Filter *.pdb -File).Count
          Write-Host "Collected $count PDB file(s) into $stage"
          # An official version-tag build ships with crash capture (Crashpad) ON — see
          # "Configure Release tree" above — so its uploaded minidumps are only ever
          # symbolicatable if PDBs were actually archived here. A missing PDB set for
          # such a build silently ships crash reporting nobody can act on; fail-closed
          # rather than warn-and-continue. Non-official builds (fork/PR/branch, no key)
          # never enable crash capture, so a missing PDB there is genuinely harmless.
          $isVersionTag = ($env:GITHUB_REF_TYPE -eq 'tag') -and ($env:GITHUB_REF_NAME -like 'v*')
          $isOfficial = [bool]$env:PUBKEY -and $isVersionTag
          if ($count -eq 0) {
            if ($isOfficial) {
              Write-Host "::error::No PDB files were found in the Release build tree for an OFFICIAL version-tag build. Crashpad is enabled, so uploaded minidumps from this release could never be symbolicated. Failing the build."
              exit 1
            }
            Write-Host "::warning::No PDB files were found in the Release build tree. Symbol archiving will be empty. (Not an official version-tag build, so this is non-fatal.)"
          }
          "dir=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      - name: Upload Release PDBs (symbol archive)
        uses: actions/upload-artifact@v4
        with:
          name: ExoSnap-${{ steps.pdbs.outputs.version }}-windows-x64-pdb-${{ github.run_id }}
          path: ${{ steps.pdbs.outputs.dir }}/*.pdb
          if-no-files-found: warn

      - name: Resolve artifact paths
        id: artifact
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(\s*exosnap\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "dir=.workspace/release/$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        shell: pwsh

      # Expose the portable + MSI SHA-256 hashes as job outputs so the
      # sign-manifest job can bind them into the signed update-manifest.json.
      # The sidecars are written by build-release-artifacts.ps1 as
      # "<hash>  <filename>"; take the first whitespace-delimited token.
      - name: Read artifact SHA-256 hashes
        id: shas
        run: |
          $dir = "${{ steps.artifact.outputs.dir }}"
          $ver = "${{ steps.artifact.outputs.version }}"
          $portableSha = (Get-Content -LiteralPath (Join-Path $dir "ExoSnap-$ver-windows-x64-portable.sha256") -Raw).Trim().Split(' ')[0]
          $msiShaFile = Join-Path $dir "ExoSnap-$ver-windows-x64.msi.sha256"
          $msiSha = if (Test-Path -LiteralPath $msiShaFile) { (Get-Content -LiteralPath $msiShaFile -Raw).Trim().Split(' ')[0] } else { '' }
          "portable_sha256=$portableSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_sha256=$msiSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "portable_sha256=$portableSha"
          Write-Host "msi_sha256=$msiSha"
        shell: pwsh

      - name: Upload all release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExoSnap-${{ steps.artifact.outputs.version }}-windows-x64
          path: |
            ${{ steps.artifact.outputs.dir }}/ExoSnap-${{ steps.artifact.outputs.version }}-windows-x64-portable.zip
            ${{ steps.artifact.outputs.dir }}/ExoSnap-${{ steps.artifact.outputs.version }}-windows-x64-portable.sha256
            ${{ steps.artifact.outputs.dir }}/ExoSnap-${{ steps.artifact.outputs.version }}-windows-x64.msi
            ${{ steps.artifact.outputs.dir }}/ExoSnap-${{ steps.artifact.outputs.version }}-windows-x64.msi.sha256
            ${{ steps.artifact.outputs.dir }}/artifact-manifest.json
            ${{ steps.artifact.outputs.dir }}/validation-report.md
          if-no-files-found: error

  # Sign the update manifest for the in-app updater. MANDATORY for every official
  # release from 0.9.0 on: the 0.9+ update checker only surfaces a release that
  # carries an update-manifest.json asset — a release published without it is
  # invisible to in-app updates forever. Runs on a version-tag push (the tag names
  # the release the asset URLs point at) when the signing key is provisioned
  # (EXOSNAP_UPDATE_PUBLIC_KEY_HEX repo variable present = official build). Forks
  # without the key skip it rather than hard-failing. The asset URLs are the
  # canonical GitHub Release download paths for this tag.
  #
  # This job generates + signs the manifest and verifies (a) the signing key really
  # is the private half of the embedded public key and (b) the detached signature
  # verifies, then publishes update-manifest.json + .sig as a build ARTIFACT. It does
  # NOT attach them to the GitHub Release here (attach_to_release: false) — the
  # downstream publish-release job owns the Release creation + upload so the ordering
  # is deterministic (create draft → upload → re-hash → publish) instead of racing a
  # Release that may not exist yet.
  sign-manifest:
    name: Sign Update Manifest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX != '' }}
    # Matches the write declared inside sign-manifest.yml (its standalone path uploads
    # to a Release). In this called path attach_to_release is false, so the write is
    # declared for consistency but not exercised — publish-release owns the upload.
    permissions:
      contents: write
    uses: ./.github/workflows/sign-manifest.yml
    with:
      version: ${{ needs.build.outputs.version }}
      installer_sha256: ${{ needs.build.outputs.msi_sha256 }}
      portable_sha256: ${{ needs.build.outputs.portable_sha256 }}
      installer_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/ExoSnap-${{ needs.build.outputs.version }}-windows-x64.msi
      portable_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/ExoSnap-${{ needs.build.outputs.version }}-windows-x64-portable.zip
      attach_to_release: false
    secrets: inherit

  # Deterministic release publication (official version-tag builds only). Fixes the
  # release/signing race: nothing used to create the GitHub Release, yet sign-manifest
  # assumed it existed and tried to `gh release upload` into it. Order here is:
  #   1. (done by `build`) build + validate artifacts
  #   2. create a DRAFT Release for this exact tag (idempotent; reuses one if present)
  #   3. (done by `sign-manifest`) generate manifest from the artifact SHA-256s, sign,
  #      verify the keypair + signature against the embedded public key
  #   4. upload every asset (ZIP, MSI, sidecars, manifest, .sig) to the draft
  #   5. re-download the published assets and re-hash them; cross-check the manifest's
  #      embedded SHA-256s against the shipped bytes and re-verify the signature
  #   6. only then un-draft (publish) the Release
  # If any check fails the Release stays a hidden draft — fail-closed.
  publish-release:
    name: Publish GitHub Release
    needs: [build, sign-manifest]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      EXPECTED_PORTABLE_SHA: ${{ needs.build.outputs.portable_sha256 }}
      EXPECTED_MSI_SHA: ${{ needs.build.outputs.msi_sha256 }}
    steps:
      - name: Download release artifacts (ZIP + MSI + sidecars)
        uses: actions/download-artifact@v4
        with:
          name: ExoSnap-${{ needs.build.outputs.version }}-windows-x64
          path: release-assets

      - name: Download signed manifest
        uses: actions/download-artifact@v4
        with:
          name: update-manifest
          path: release-assets

      # Create the Release as a DRAFT so it (and its asset URLs) are invisible to
      # the in-app updater until every check below passes. Idempotent: if a human
      # pre-created the Release, reuse it rather than erroring.
      - name: Create draft GitHub Release (if absent)
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading into it."
          else
            echo "Creating draft release $TAG."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "ExoSnap $VERSION" \
              --notes "Automated release candidate for $TAG. Artifacts and the signed update manifest are attached and verified by CI. Review release notes, then this draft is published automatically once all checks pass. See docs/release-checklist.md before announcing."
          fi

      - name: Upload all assets to the release
        working-directory: release-assets
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "ExoSnap-$VERSION-windows-x64-portable.zip" \
            "ExoSnap-$VERSION-windows-x64-portable.sha256" \
            "ExoSnap-$VERSION-windows-x64.msi" \
            "ExoSnap-$VERSION-windows-x64.msi.sha256" \
            update-manifest.json update-manifest.json.sig \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Re-download the assets straight from the Release and re-hash them, so what a
      # user would actually fetch is proven byte-identical to what the gate built and
      # to what the signed manifest claims.
      - name: Re-download and verify published assets
        env:
          PUBKEY_HEX: ${{ vars.EXOSNAP_UPDATE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify --clobber \
            --pattern "ExoSnap-$VERSION-windows-x64-portable.zip" \
            --pattern "ExoSnap-$VERSION-windows-x64.msi" \
            --pattern "update-manifest.json" \
            --pattern "update-manifest.json.sig"
          portable_actual=$(sha256sum "verify/ExoSnap-$VERSION-windows-x64-portable.zip" | cut -d' ' -f1)
          msi_actual=$(sha256sum "verify/ExoSnap-$VERSION-windows-x64.msi" | cut -d' ' -f1)
          echo "portable expected=$EXPECTED_PORTABLE_SHA actual=$portable_actual"
          echo "msi      expected=$EXPECTED_MSI_SHA actual=$msi_actual"
          if [ "${portable_actual,,}" != "${EXPECTED_PORTABLE_SHA,,}" ]; then
            echo "::error::Portable ZIP SHA-256 changed between the build gate and the published Release asset."; exit 1
          fi
          if [ -n "$EXPECTED_MSI_SHA" ] && [ "${msi_actual,,}" != "${EXPECTED_MSI_SHA,,}" ]; then
            echo "::error::MSI SHA-256 changed between the build gate and the published Release asset."; exit 1
          fi
          pip install --quiet pynacl==1.6.2
          python3 - <<'PY'
          import json, hashlib, os, sys
          import nacl.signing
          v = os.environ["VERSION"]
          m = json.load(open("verify/update-manifest.json"))
          def sha(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for b in iter(lambda: f.read(1 << 20), b""):
                      h.update(b)
              return h.hexdigest()
          files = {
              "installer": f"verify/ExoSnap-{v}-windows-x64.msi",
              "portable":  f"verify/ExoSnap-{v}-windows-x64-portable.zip",
          }
          errs = []
          for pkg in m["packages"]:
              kind = pkg["kind"]; want = pkg["sha256"].lower()
              path = files.get(kind)
              if not path or not os.path.exists(path):
                  errs.append(f"manifest lists package '{kind}' but its asset is missing"); continue
              got = sha(path)
              if got != want:
                  errs.append(f"{kind}: manifest sha256={want} != shipped asset sha256={got}")
          if errs:
              print("::error::" + "; ".join(errs)); sys.exit(1)
          data = open("verify/update-manifest.json", "rb").read()
          sig = bytes.fromhex(open("verify/update-manifest.json.sig").read().strip())
          nacl.signing.VerifyKey(bytes.fromhex(os.environ["PUBKEY_HEX"])).verify(data, sig)
          print("Published assets match the build gate and the signed manifest; signature verifies against the embedded public key.")
          PY

      - name: Publish (un-draft) the release
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published release $TAG."
