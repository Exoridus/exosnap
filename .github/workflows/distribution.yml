name: Distribute release

# Prepares, validates and rehearses one already-published immutable GitHub
# Release, freezes the prepared artifacts and their readiness digest, then,
# behind the protected `distribution` environment, submits exactly those
# frozen artifacts through each package manager's official program. The
# GitHub Release is never rebuilt and never modified.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released product version to distribute (x.y.z)
        required: true
        type: string
      source_commit:
        description: Qualified source commit that version was released from
        required: true
        type: string
      publish:
        description: Request the protected distribution approval and submit after a READY preparation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: distribute-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/next' && github.repository == 'Exoridus/exosnap'
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.validate.outputs.ready }}
      digest: ${{ steps.validate.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned WinGet client used for manifest validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
          $expectedBundle = '65DEA9C01CE08EE7B763366B27C0E651F97DB857C11CA9B9C301826C10092F2E'
          $expectedDependencies = 'BA875AFE9D190F61218985AC0292A99D1DB710BF93E13C68944CA9D89F0D82D1'
          $expectedLicense = 'BCB15118EC47DF24E3E6013A7006147C3A15B3A8104ED660FE87C8B4ED01F485'
          $dir = Join-Path $env:RUNNER_TEMP 'winget-client'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $bundle = Join-Path $dir 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'
          $dependencies = Join-Path $dir 'DesktopAppInstaller_Dependencies.zip'
          $license = Join-Path $dir 'winget-license.xml'
          Invoke-WebRequest -Uri "$releases/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -OutFile $bundle
          Invoke-WebRequest -Uri "$releases/DesktopAppInstaller_Dependencies.zip" -OutFile $dependencies
          Invoke-WebRequest -Uri "$releases/e53e159d00e04f729cc2180cffd1c02e_License1.xml" -OutFile $license
          if ((Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash -ne $expectedBundle) { throw 'the WinGet bundle does not match its pinned digest' }
          if ((Get-FileHash -LiteralPath $dependencies -Algorithm SHA256).Hash -ne $expectedDependencies) { throw 'the WinGet dependencies do not match their pinned digest' }
          if ((Get-FileHash -LiteralPath $license -Algorithm SHA256).Hash -ne $expectedLicense) { throw 'the WinGet license does not match its pinned digest' }
          Expand-Archive -LiteralPath $dependencies -DestinationPath $dir
          # The runner has no Microsoft Store, so a plain Add-AppxPackage leaves
          # a package that cannot launch ("No applicable app licenses found").
          # Provisioning applies the package's own license and makes the client
          # runnable without the Store.
          $dependencyPackages = @(Get-ChildItem -LiteralPath (Join-Path $dir 'x64') -Filter *.appx | ForEach-Object { $_.FullName })
          Add-AppxProvisionedPackage -Online -PackagePath $bundle -LicensePath $license -DependencyPackagePath $dependencyPackages | Out-Null
          $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps'
          $winget = Join-Path $alias 'winget.exe'
          if (Test-Path -LiteralPath $winget) {
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $alias
          } else {
            $package = Get-AppxPackage -Name Microsoft.DesktopAppInstaller | Select-Object -First 1
            if (-not $package) { throw 'the WinGet client was not provisioned' }
            $winget = Join-Path $package.InstallLocation 'winget.exe'
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $package.InstallLocation
          }
          & $winget --version
      - name: Build the distribution tools from the trusted workflow revision
        run: cargo build --locked --manifest-path tools/Cargo.toml -p exo-dev -p exo-verify
      - name: Download the immutable public release metadata and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'version must be x.y.z' }
          $tag = "v$env:VERSION"
          gh api "repos/Exoridus/exosnap/releases/tags/$tag" > release.json
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          gh release download $tag --repo Exoridus/exosnap --dir assets `
            --pattern "ExoSnap-$env:VERSION-windows-x64.msi" `
            --pattern "ExoSnap-$env:VERSION-windows-x64.msi.sha256" `
            --pattern "ExoSnap-$env:VERSION-windows-x64-portable.zip" `
            --pattern "ExoSnap-$env:VERSION-windows-x64-portable.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'could not download the release assets' }
      - name: Resolve the release and prepare every channel
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: >-
          ./tools/target/debug/exo-dev.exe distribution prepare
          --version "$env:VERSION" --source-commit "$env:SOURCE_COMMIT"
          --release-json release.json --assets assets --out prepared
      - name: Rehearse the prepared Chocolatey package against the frozen MSI
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          ./tools/target/debug/exo-verify.exe rehearse
          --channel chocolatey --package-source prepared/packaging/chocolatey
          --installer "assets/ExoSnap-$env:VERSION-windows-x64.msi" --out rehearsal
      - name: Freeze and validate the distribution readiness report
        id: validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item rehearsal/chocolatey-rehearsal.json prepared/chocolatey-rehearsal.json
          ./tools/target/debug/exo-dev.exe distribution validate --prepared prepared --assets assets --chocolatey-rehearsal prepared/chocolatey-rehearsal.json
          if ($LASTEXITCODE -ne 0) { throw 'distribution preparation is not READY' }
          $digest = (Get-Content -LiteralPath prepared/distribution-readiness.json.sha256 -Raw).Split(' ')[0]
          if ($digest -notmatch '^[0-9a-f]{64}$') { throw 'the readiness digest is malformed' }
          "ready=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "digest=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Retain the frozen preparation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: distribution-prepared
          path: prepared/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: prepare
    if: inputs.publish && needs.prepare.outputs.ready == 'true' && github.ref == 'refs/heads/next' && github.repository == 'Exoridus/exosnap'
    environment: distribution
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned WingetCreate client used for submission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA'
          $dir = Join-Path $env:RUNNER_TEMP 'wingetcreate'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $exe = Join-Path $dir 'wingetcreate.exe'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' -OutFile $exe
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -ne $expected) { throw 'WingetCreate does not match its pinned digest' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir
      - name: Build the distribution tool from the trusted workflow revision
        run: cargo build --locked --manifest-path tools/Cargo.toml -p exo-dev
      - name: Consume the exact frozen preparation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distribution-prepared
          path: prepared
      - name: Re-download the immutable public assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:VERSION"
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          gh release download $tag --repo Exoridus/exosnap --dir assets `
            --pattern "ExoSnap-$env:VERSION-windows-x64.msi" `
            --pattern "ExoSnap-$env:VERSION-windows-x64.msi.sha256" `
            --pattern "ExoSnap-$env:VERSION-windows-x64-portable.zip" `
            --pattern "ExoSnap-$env:VERSION-windows-x64-portable.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'could not download the release assets' }
      - name: Revalidate the frozen preparation against its digest
        shell: pwsh
        env:
          READINESS_DIGEST: ${{ needs.prepare.outputs.digest }}
        run: >-
          ./tools/target/debug/exo-dev.exe distribution validate
          --prepared prepared --assets assets
          --chocolatey-rehearsal prepared/chocolatey-rehearsal.json
          --expect-readiness-digest "$env:READINESS_DIGEST"
      - name: Submit to Chocolatey Community
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          READINESS_DIGEST: ${{ needs.prepare.outputs.digest }}
        run: >-
          ./tools/target/debug/exo-dev.exe distribution submit
          --prepared prepared --channel chocolatey --out submissions/chocolatey.json
          --expect-readiness-digest "$env:READINESS_DIGEST"
      - name: Submit to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_SUBMIT_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}
          READINESS_DIGEST: ${{ needs.prepare.outputs.digest }}
        run: >-
          ./tools/target/debug/exo-dev.exe distribution submit
          --prepared prepared --channel winget --out submissions/winget.json
          --expect-readiness-digest "$env:READINESS_DIGEST"
      - name: Update the Exoridus/scoop-exosnap bucket
        shell: pwsh
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          READINESS_DIGEST: ${{ needs.prepare.outputs.digest }}
        run: >-
          ./tools/target/debug/exo-dev.exe distribution submit
          --prepared prepared --channel scoop --out submissions/scoop.json
          --expect-readiness-digest "$env:READINESS_DIGEST"
      - name: Retain the submission records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: distribution-submissions
          path: submissions/
          if-no-files-found: warn
          retention-days: 90
